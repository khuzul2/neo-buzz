name: Pitch evaluation

# The shared pitch engine (docs/specs/pitch.md, phase PT1) scored on real recordings. By hand only (workflow_dispatch). The data are
# downloaded here, on the runner, from Zenodo, each file checked against the checksum Zenodo publishes for it; they are never
# committed and never uploaded. What the run keeps is a Markdown report (the job summary and an artifact) and a CSV of the
# per-stem figures.
#  - MDB-stem-synth (zenodo.org/records/1481172, CC BY-NC 4.0, 1.8 GB): raw pitch and chroma accuracy, voicing recall and false
#    alarm, overall accuracy, per stem and overall, for each range and for Low latency against Quality.
#  - Amateur Vocal Percussion (zenodo.org/record/5036529, CC BY 4.0, 231 MB): onset F-measure and latency, trigger accuracy trained
#    on 10 hits per class per participant.
#  - VocalSet 1.1 (zenodo.org/records/1442513, CC BY 4.0, 2 GB zip read in place): a subset of techniques and vowels; voicing, octave
#    jumps, held-note stability, Low latency against Quality, and the vowel estimator on the labelled vowels.
#  - Neo Tune (docs/specs/neo-tune.md §9 and §11) on the same VocalSet subset: the pitch of the corrected output against the nearest scale note
#    before and after, voicing kept, an artefact proxy, and the NT2 quality gates (vibrato kept, jitter and shimmer, long-term spectrum,
#    sub-harmonics, bursts, note sequence, null) for NT1 (the engine frozen in tools/PitchEval/TuneNt1) and NT2 at Natural 0, 50 and 100.
#    A listening pack (six excerpts of at most 8 s: original, NT1's old output, NT2 at Natural 0/50/100, levels matched, a blind folder with a
#    key, the CC BY 4.0 attribution in the README) is uploaded as the artifact neo-tune-excerpts. No audio is committed.
# The tool is tools/PitchEval (it links Machines/NeoBuzz.Dsp and nothing else).
#
# The am1 job (docs/specs/audio-to-midi.md section 8) scores Neo Audio to MIDI's engine as the machine runs it (tools/PitchEval --am1-*):
#  - GuitarSet (zenodo.org/records/3371780, CC BY 4.0): the hexaphonic pickup's per-string lines (a spread of the recordings, read by range requests
#    into the zip: tools/am1/fetch_guitarset.py) against the JAMS note annotation of each string: Melody note F-measure and latency, Fast and Stable.
#  - IDMT-SMT-Drums (zenodo.org/records/7544164, CC BY-NC-ND 4.0, 287 MB; evaluation only): kick, snare and hat F-measure and timing in the drum mixes,
#    with the built-in rules and calibrated from five hits of each drum of the same kit.
#  - MDB-stem-synth again: Melody note F-measure and the pitch right on the voiced frames.
#  - Piano-roll plots (annotated against played) of three excerpts of each mode, uploaded as the artifact am1-plots.
#
# The autowarp job (docs/specs/neo-audio.md, AW1 as built) scores the beat and downbeat tracker behind Auto-warp (tools/AutoWarpEval, tools/autowarp):
#  - Groove MIDI Dataset (CC BY 4.0) and Slakh2100 (Zenodo 4599666, CC BY 4.0), read by range requests and as a stream (tools/autowarp/fetch_data.py); the ground
#    truth beats and downbeats come from the MIDI. The generated lines of the repo (steady, drift, step, ritardando; drums, mix, pad) and steady loops.
#  - Beat F at +-70 ms, CMLt, AMLt (mir_eval, MIT), downbeat F and the grid error after warping, for auto-warp against today's steady detection; half of each set is held out.
#  - Uploads the report, and the listening pack (two performances and the drift and step lines, steady against auto-warp, on a click) as the artifact autowarp-pack.
#
# The convert job (docs/specs/pitch.md section 9.6) scores Convert to MIDI, the converters as the app runs them (tools/ConvertEval):
#  - MDB-stem-synth again: note F-measure of the melody converter (onset +-50 ms, pitch +-50 cents; the reference notes cut from the annotated f0).
#  - Groove MIDI Dataset (Magenta, CC BY 4.0), the test split read by HTTP range requests (tools/convert/fetch_data.py): per-class onset F-measure of the drum converter.
#  - Drums on other kits (CD1; the drum classifier was fitted on the Groove train split, one electronic kit): IDMT-SMT-Drums (Zenodo 7544164, CC BY-NC-ND 4.0; real, techno
#    and wave kits) and MDB Drums (CC BY-NC-SA 4.0; acoustic, with toms and cymbals), AM2's rules against the CD1 network, per class, with the gate of docs/specs/pitch.md section 9.9.
#  - MAESTRO v3.0.0 (Magenta, CC BY-NC-SA 4.0), 60-second excerpts by range requests: note F-measure of the harmony converter (Basic Pitch),
#    and its agreement with the Python basic_pitch package on the same files and model.

# The aw2-* jobs (docs/specs/neo-audio.md, AW2 as built) train and score the beat and downbeat model of Auto-warp. Off unless `aw2` is set (turn the other jobs off when dispatching them).
# Training data are CC BY, CC BY 3.0 or CC0 only, fetched here with the licence of every file checked (tools/aw2/fetch.py, fetch_slakh.py); nothing is committed or kept.
#  - aw2-tools: builds tools/AutoWarpEval (the feature tool, the evaluation) and tools/aw2/warp.cpp (Signalsmith Stretch, MIT), checks the label mapping of the warp, the C# forward pass
#    against PyTorch and the time of a 10-minute file with random weights of d=64 and d=96.
#  - aw2-prep (a matrix of five sets: GMD, GuitarSet, Candombe, AAM with stem dropout, FSL10K loops): fetch, warp and transpose, features by the app's own front end; held-out items are kept for
#    the evaluation. Kept in the Actions cache (keyed by set and feature version) and passed on as artifacts of one day.
#  - aw2-slakh: streams the first 5 GB of Slakh2100 with a forced reconnect (the tool of AW2b's full stream).
#  - aw2-train: a time-boxed CPU training, then AW1's DSP against the model on the held-out items (tools/aw2/score2.py), and the timing of a 10-minute file.
#  - aw2-cleanup: deletes the one-day artifacts.

on:
  workflow_dispatch:
    inputs:
      mdb:
        description: 'MDB-stem-synth'
        type: boolean
        default: true
      avp:
        description: 'Amateur Vocal Percussion'
        type: boolean
        default: true
      vocalset:
        description: 'VocalSet'
        type: boolean
        default: true
      tune:
        description: 'Neo Tune on VocalSet (needs the VocalSet download; writes the listening excerpts)'
        type: boolean
        default: true
      convert:
        description: 'Convert to MIDI (melody on MDB-stem-synth, drums on the Groove MIDI Dataset, harmony on MAESTRO)'
        type: boolean
        default: true
      maestro_count:
        description: 'Convert to MIDI: MAESTRO excerpts (60 s each)'
        type: string
        default: '10'
      am1:
        description: 'Neo Audio to MIDI (GuitarSet, IDMT-SMT-Drums and MDB-stem-synth through the machine engine, with piano-roll plots)'
        type: boolean
        default: true
      autowarp:
        description: 'Auto-warp (beats and downbeats on Groove MIDI Dataset, Slakh2100 and the generated lines, against today steady-tempo detection)'
        type: boolean
        default: true
      aw2:
        description: 'AW2 beat model: tools, prep, pilot training and evaluation (turn the other jobs off)'
        type: boolean
        default: false
      aw2_limit:
        description: 'AW2: items per training split in each set'
        type: string
        default: '100'
      aw2_variants:
        description: 'AW2: warped variants per training item'
        type: string
        default: '2'
      aw2_minutes:
        description: 'AW2: training time, minutes'
        type: string
        default: '55'
      aw2_width:
        description: 'AW2: model width d (64 or 96)'
        type: string
        default: '64'
      aw2b:
        description: 'AW2b: full data, chained training, tuning on validation, evaluation (with the tools; turn the other jobs off)'
        type: boolean
        default: false
      aw2c:
        description: 'AW2c: more data (E-GMD, new AAM tracks), training continued from the shipped model, tuning of the tempo prior and the phase check on validation, shipped model against the candidate (with the tools; turn the other jobs off)'
        type: boolean
        default: false
      aw2c_measure:
        description: 'AW2c: the measure-only sets (GTZAN, Ballroom; RWC is skipped): "check" fetches and matches only (nothing is scored), "true" scores AW1 and the model compiled into this build (at most two such runs in all); metrics only leave the runner'
        type: string
        default: 'false'
      aw2b_pack:
        description: 'AW2b: the listening pack and the timing of the model compiled into this build (BeatModelData.cs), on a few held-out items'
        type: boolean
        default: false
      aw2b_aam:
        description: 'AW2b: AAM mixes per zip of 1000 tracks (three zips)'
        type: string
        default: '150'
      aw2b_slakh_gb:
        description: 'AW2b: gigabytes of the Slakh2100 stream (random member order: a prefix is a uniform sample)'
        type: string
        default: '40'
      aw2b_slakh_min:
        description: 'AW2b: the most minutes of the Slakh2100 stream (the download speed varies)'
        type: string
        default: '240'
      aw2b_train:
        description: 'AW2b: training minutes per chained job (two jobs)'
        type: string
        default: '120'
      aw3:
        description: 'AW3 and AW4 (turn the other jobs off): words "sweep" (the timing fixes on the halves of half=, default val; reach=0,25,35 is the attack reach in ms, resid=inf:inf,30:60 the residual bounds p95:max in ms) and/or "pack" (the listening pack v2); AW4: "bt-parity", "bt-eval" (the test halves of GMD, GuitarSet, Candombe and AAM, AW1 against AW2, AW3 and the pretrained network), "bt-measure" (GTZAN and Ballroom, measure only), "bt-speed" (a 10-minute file) and "bt-listen" (the round-3 listening pack)'
        type: string
        default: ''
      guitarset_every:
        description: 'Neo Audio to MIDI: one GuitarSet solo take of the held-out players 03 to 05 in this many (the tuning used players 00 to 02)'
        type: string
        default: '2'
      mdb_limit:
        description: 'MDB-stem-synth: evaluate only this many stems, evenly spread (0 = all 230)'
        type: string
        default: '0'
      vocalset_per_group:
        description: 'VocalSet: files per singer and technique'
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ github.event.inputs.mdb != 'false' || github.event.inputs.avp != 'false' || github.event.inputs.vocalset != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/pitch-eval-data
      # What the dispatch inputs say.
      RUN_MDB: ${{ github.event.inputs.mdb != 'false' }}
      RUN_AVP: ${{ github.event.inputs.avp != 'false' }}
      RUN_VOCALSET: ${{ github.event.inputs.vocalset != 'false' }}
      RUN_TUNE: ${{ github.event.inputs.tune != 'false' }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build the evaluation tool
      run: dotnet build tools/PitchEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # fetch <record> <file name> <destination>: Zenodo's API for the file's URL and md5, then the check.
    - name: Download and check the data
      run: |
        set -euo pipefail
        fetch() {
          local rec="$1" name="$2" dest="$3"
          local meta md5 try
          # Zenodo's API now and then answers with an error body: ask again (up to 8 times) until the file's checksum is in the answer.
          for try in 1 2 3 4 5 6 7 8; do
            meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
            md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
            [ -n "$md5" ] && break
            echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
          done
          [ -n "$md5" ] || { echo "no checksum for $name"; return 1; }
          echo "$rec $name md5 $md5; licence: $(echo "$meta" | python3 -c "import json,sys; print(json.load(sys.stdin)['metadata']['license'])" 2>/dev/null || echo unknown)"
          curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
          echo "$md5  $dest" | md5sum -c -
        }
        if [ "$RUN_MDB" = "true" ]; then
          fetch 1481172 MDB-stem-synth.tar.gz "$DATA/mdb.tar.gz"
          mkdir -p "$DATA/mdb"
          tar -xzf "$DATA/mdb.tar.gz" -C "$DATA/mdb" --exclude='*/._*'
          rm "$DATA/mdb.tar.gz"
        fi
        if [ "$RUN_AVP" = "true" ]; then
          fetch 5036529 AVP_Dataset.zip "$DATA/avp.zip"
          mkdir -p "$DATA/avp"
          unzip -q "$DATA/avp.zip" -x '__MACOSX/*' -d "$DATA/avp"
          rm "$DATA/avp.zip"
        fi
        if [ "$RUN_VOCALSET" = "true" ] || [ "$RUN_TUNE" = "true" ]; then
          fetch 1442513 VocalSet11.zip "$DATA/vocalset.zip"
        fi
        df -h /mnt | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        args=(--out pitch-eval-report.md --csv pitch-eval-stems.csv)
        [ "$RUN_MDB" = "true" ] && args+=(--mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}")
        [ "$RUN_AVP" = "true" ] && args+=(--avp "$DATA/avp")
        [ "$RUN_VOCALSET" = "true" ] && args+=(--vocalset "$DATA/vocalset.zip" --vocalset-per-group "${{ github.event.inputs.vocalset_per_group || '2' }}")
        # Neo Tune on the same subset; the excerpts go to a folder that is uploaded as its own artifact (nothing is committed).
        [ "$RUN_TUNE" = "true" ] && args+=(--tune "$DATA/vocalset.zip" --tune-excerpts neo-tune-excerpts)
        true
        dotnet run -c Release --no-build --project tools/PitchEval -- "${args[@]}"

    - name: Job summary
      if: always()
      run: |
        if [ -f pitch-eval-report.md ]; then
          # The summary is capped at 1 MiB: the per-stem table is in the artifact whole.
          head -c 900000 pitch-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report and the per-stem CSV (figures, no audio).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pitch-eval-report
        path: |
          pitch-eval-report.md
          pitch-eval-stems.csv
        if-no-files-found: ignore

    # Six before/after excerpts (at most 8 s each) of VocalSet (CC BY 4.0, the attribution is in their README) for listening.
    # An artifact of the run only: never committed.
    - name: Upload the listening excerpts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: neo-tune-excerpts
        path: neo-tune-excerpts
        if-no-files-found: ignore

  convert:
    if: ${{ github.event.inputs.convert != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/convert-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/ConvertEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # MDB-stem-synth as in the evaluate job: Zenodo's API for the file's md5, then the check.
    - name: Download and check MDB-stem-synth
      run: |
        set -euo pipefail
        rec=1481172; name=MDB-stem-synth.tar.gz; dest="$DATA/mdb.tar.gz"
        for try in 1 2 3 4 5 6 7 8; do
          meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
          md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
          [ -n "$md5" ] && break
          echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
        done
        [ -n "$md5" ] || { echo "no checksum for $name"; exit 1; }
        curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
        echo "$md5  $dest" | md5sum -c -
        mkdir -p "$DATA/mdb"
        tar -xzf "$dest" -C "$DATA/mdb" --exclude='*/._*'
        rm "$dest"

    # The Groove MIDI Dataset's test split and MAESTRO's excerpts, by range requests into the published zips.
    - name: Fetch the drum and piano data
      run: |
        set -euo pipefail
        pip install --quiet remotezip mido
        python3 -I tools/convert/fetch_data.py --gmd "$DATA/gmd" --gmd-per-drummer 2 --maestro "$DATA/maestro" --maestro-count "${{ github.event.inputs.maestro_count || '10' }}"
        du -sh "$DATA"/* | cat

    # Drums on other kits (CD1, docs/specs/pitch.md section 9.9): IDMT-SMT-Drums (Zenodo 7544164, CC BY-NC-ND 4.0, the mixes of the real, techno and wave kits)
    # and MDB Drums (github.com/CarlSouthall/MDBDrums, CC BY-NC-SA 4.0, acoustic kits with toms and cymbals), for measurement on the runner only.
    - name: Download and check IDMT-SMT-Drums
      run: |
        set -euo pipefail
        rec=7544164; name=IDMT-SMT-DRUMS-V2.zip; dest="$DATA/idmt.zip"
        for try in 1 2 3 4 5 6 7 8; do
          meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
          md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
          [ -n "$md5" ] && break
          echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
        done
        [ -n "$md5" ] || { echo "no checksum for $name"; exit 1; }
        curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
        echo "$md5  $dest" | md5sum -c -
        mkdir -p "$DATA/idmt"
        unzip -q "$dest" '*#MIX.wav' '*#MIX.xml' -d "$DATA/idmt"
        rm "$dest"

    - name: Download MDB Drums
      run: |
        set -euo pipefail
        git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/CarlSouthall/MDBDrums.git "$DATA/mdbdrums"
        git -C "$DATA/mdbdrums" sparse-checkout set "MDB Drums/annotations/class" "MDB Drums/audio/full_mix" "MDB Drums/audio/drum_only"
        git -C "$DATA/mdbdrums" rev-parse HEAD
        du -sh "$DATA"/idmt "$DATA"/mdbdrums | cat

    # The upstream package, from its source (Apache-2.0), on the model file the app embeds: the reference the port is checked against.
    - name: Basic Pitch reference
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/spotify/basic-pitch.git "$RUNNER_TEMP/basic-pitch"
        git -C "$RUNNER_TEMP/basic-pitch" rev-parse HEAD
        pip install --quiet numpy scipy librosa resampy pretty_midi mir_eval onnxruntime typing_extensions
        cmp "$RUNNER_TEMP/basic-pitch/basic_pitch/saved_models/icassp_2022/nmp.onnx" 3rdParty/basic-pitch/nmp.onnx
        python3 -I tools/convert/basic_pitch_reference.py --model 3rdParty/basic-pitch/nmp.onnx --upstream "$RUNNER_TEMP/basic-pitch" --out "$DATA/maestro-reference.json" "$DATA"/maestro/*.wav

    - name: Evaluate
      run: |
        set -euo pipefail
        dotnet run -c Release --no-build --project tools/ConvertEval -- --out convert-eval-report.md \
          --mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}" \
          --gmd "$DATA/gmd" --maestro "$DATA/maestro" --reference "$DATA/maestro-reference.json" \
          --ood-idmt "$DATA/idmt" --ood-mdb "$DATA/mdbdrums"

    - name: Job summary
      if: always()
      run: |
        if [ -f convert-eval-report.md ]; then
          head -c 900000 convert-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report (figures, no audio).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: convert-eval-report
        path: convert-eval-report.md
        if-no-files-found: ignore

  am1:
    if: ${{ github.event.inputs.am1 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/am1-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/PitchEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # Zenodo's API for each file's md5, then the check (as the evaluate job does).
    - name: Download and check IDMT-SMT-Drums and MDB-stem-synth
      run: |
        set -euo pipefail
        fetch() {
          local rec="$1" name="$2" dest="$3"
          local meta md5 try
          for try in 1 2 3 4 5 6 7 8; do
            meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
            md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
            [ -n "$md5" ] && break
            echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
          done
          [ -n "$md5" ] || { echo "no checksum for $name"; return 1; }
          echo "$rec $name md5 $md5; licence: $(echo "$meta" | python3 -c "import json,sys; print(json.load(sys.stdin)['metadata']['license'])" 2>/dev/null || echo unknown)"
          curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
          echo "$md5  $dest" | md5sum -c -
        }
        fetch 7544164 IDMT-SMT-DRUMS-V2.zip "$DATA/idmt.zip"
        mkdir -p "$DATA/idmt"
        unzip -q "$DATA/idmt.zip" -x '__MACOSX/*' -d "$DATA/idmt"
        rm "$DATA/idmt.zip"
        fetch 1481172 MDB-stem-synth.tar.gz "$DATA/mdb.tar.gz"
        mkdir -p "$DATA/mdb"
        tar -xzf "$DATA/mdb.tar.gz" -C "$DATA/mdb" --exclude='*/._*'
        rm "$DATA/mdb.tar.gz"
        df -h /mnt | cat

    # GuitarSet's annotations and a spread of the hexaphonic recordings, by range requests.
    - name: Fetch GuitarSet
      run: |
        set -euo pipefail
        pip install --quiet remotezip matplotlib
        python3 -I tools/am1/fetch_guitarset.py "$DATA/gs" --every "${{ github.event.inputs.guitarset_every || '2' }}" --offset 0 --players 03,04,05 --solo
        du -sh "$DATA"/* | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        mkdir -p am1-plots
        dotnet run -c Release --no-build --project tools/PitchEval -- --out am1-eval-report.md \
          --am1-guitarset "$DATA/gs" --gs-mono --gs-players 03,04,05 --am1-idmt "$DATA/idmt" --am1-mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}" \
          --am1-plots am1-plots

    - name: Piano-roll plots
      run: python3 -I tools/am1/plot_rolls.py am1-plots

    - name: Job summary
      if: always()
      run: |
        if [ -f am1-eval-report.md ]; then
          head -c 900000 am1-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report and the plots (figures: note and hit times, no audio).
    - name: Upload the report and the plots
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: am1-eval
        path: |
          am1-eval-report.md
          am1-plots/*.png
          am1-plots/*.json
        if-no-files-found: ignore

  autowarp:
    if: ${{ github.event.inputs.autowarp != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/autowarp-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/AutoWarpEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # The Groove MIDI Dataset's recordings (range requests into the zip) and Slakh2100's test split (the tarball read as a stream).
    - name: Fetch the Groove MIDI Dataset
      run: |
        set -euo pipefail
        pip install --quiet numpy mir_eval soundfile pretty_midi remotezip requests
        python3 -I tools/autowarp/fetch_data.py --gmd "$DATA/gmd"
        du -sh "$DATA"/* | cat

    # Slakh2100 is a stream of a very large tarball: if it fails, the report says so (no slakh figures) rather than losing the rest.
    - name: Fetch Slakh2100
      id: slakh
      continue-on-error: true
      run: |
        set -euo pipefail
        python3 -I tools/autowarp/fetch_data.py --slakh "$DATA/slakh"
        du -sh "$DATA"/slakh | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        T="dotnet run -c Release --no-build --project tools/AutoWarpEval --"
        $T --generated --out "$DATA/generated.json"
        $T --dir "$DATA/gmd" --set gmd --out "$DATA/gmd.json"
        extra=""
        if ls "$DATA"/slakh/*.wav > /dev/null 2>&1; then
          $T --dir "$DATA/slakh" --set slakh --out "$DATA/slakh.json"
          extra="$DATA/slakh.json"
        else
          echo "no Slakh2100 data (the fetch step: ${{ steps.slakh.outcome }})"
        fi
        python3 -I tools/autowarp/score.py "$DATA/generated.json" "$DATA/gmd.json" $extra --out autowarp-report.md --csv autowarp-per-file.csv
        $T --pack autowarp-pack --gmd "$DATA/gmd"

    - name: Job summary
      if: always()
      run: |
        if [ -f autowarp-report.md ]; then
          head -c 900000 autowarp-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # The report and the per-file figures (no data).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: autowarp-report
        path: |
          autowarp-report.md
          autowarp-per-file.csv
        if-no-files-found: ignore

    # The listening pack: renders of two Groove MIDI Dataset performances (CC BY 4.0, Magenta) and the generated lines; a handful of files.
    - name: Upload the listening pack
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: autowarp-pack
        path: autowarp-pack/
        if-no-files-found: ignore

  aw2-tools:
    if: ${{ github.event.inputs.aw2 == 'true' || github.event.inputs.aw2b == 'true' || github.event.inputs.aw2b_pack == 'true' || github.event.inputs.aw2c == 'true' || github.event.inputs.aw2c_measure == 'true' || github.event.inputs.aw2c_measure == 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Build the evaluation and feature tool, and the warp tool
      run: |
        set -euo pipefail
        dotnet build tools/AutoWarpEval -c Release -nologo -v q
        g++ -O2 -std=c++17 -I NeoStretch/third_party tools/aw2/warp.cpp -o aw2warp
        mkdir -p aw2-tools
        cp -r tools/AutoWarpEval/bin/Release/net10.0/. aw2-tools/
        cp aw2warp aw2-tools/aw2warp
    - name: Warp label-mapping self-test
      run: |
        pip install --quiet numpy scipy
        cd tools/aw2 && python3 augment.py --selftest ../../aw2warp | tee ../../warp-selftest.txt
    - name: Forward pass against PyTorch, and timing of a 10-minute file
      run: |
        set -euo pipefail
        pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 export.py --parity ../../parity.bin
        cd ../..
        dotnet aw2-tools/AutoWarpEval.dll --parity parity.bin | tee parity.txt
        cmp parity.bin ReBuzz.SessionTests/AutoWarp/aw2-parity.bin && echo "the committed parity file is what PyTorch writes" || echo "NOTE: the parity file differs (a fresh PyTorch init)"
        for d in 64 96; do
          python3 - "$d" <<'PY'
        import sys, torch
        sys.path.insert(0, "tools/aw2")
        from model import Net
        torch.manual_seed(1)
        n = Net(d=int(sys.argv[1]))
        torch.save({"cfg": n.cfg, "state": n.state_dict()}, f"random{sys.argv[1]}.pt")
        PY
          (cd tools/aw2 && python3 export.py --ckpt ../../random$d.pt --out ../../random$d.aw2m)
          dotnet aw2-tools/AutoWarpEval.dll --bench random$d.aw2m 600 | tee -a timing-random.txt
        done
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools
        path: aw2-tools/
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools-report
        path: |
          warp-selftest.txt
          parity.txt
          timing-random.txt
        retention-days: 7

  aw2-prep:
    if: ${{ github.event.inputs.aw2 == 'true' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        set: [gmd, guitarset, candombe, aam, fsl10k]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Restore a finished prep
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f1-${{ matrix.set }}-${{ github.event.inputs.aw2_limit }}-${{ github.event.inputs.aw2_variants }}
    - name: Fetch and prepare
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        extra=""
        if [ "${{ matrix.set }}" = "aam" ]; then extra="--stems 40"; fi
        python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit ${{ github.event.inputs.aw2_limit }} $extra
        mkdir -p ../../prep-out/shards ../../prep-out/eval ../../prep-out/licences
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants ${{ github.event.inputs.aw2_variants }} \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/${{ matrix.set }}-licences.tsv
        if [ -f /mnt/aw2/items/attribution.tsv ]; then cp /mnt/aw2/items/attribution.tsv ../../prep-out/licences/${{ matrix.set }}-attribution.tsv; fi
        du -sh ../../prep-out/* | cat
    - name: Save the prep
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f1-${{ matrix.set }}-${{ github.event.inputs.aw2_limit }}-${{ github.event.inputs.aw2_variants }}
    - uses: actions/upload-artifact@v6
      with:
        name: prep-${{ matrix.set }}
        path: prep-out/
        retention-days: 1

  aw2-slakh:
    if: ${{ github.event.inputs.aw2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Stream the first 5 GB of Slakh2100 with one forced reconnect
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        start=$(date +%s)
        python3 -u fetch_slakh.py /mnt/aw2/slakh --max-bytes 5000000000 --force-reconnect-at 2000000000 | tee ../../slakh-stream.txt
        echo "seconds: $(( $(date +%s) - start ))" | tee -a ../../slakh-stream.txt
        du -sh /mnt/aw2/slakh/* | tee -a ../../slakh-stream.txt
    - uses: actions/upload-artifact@v6
      with:
        name: slakh-stream-test
        path: slakh-stream.txt
        retention-days: 7

  aw2-train:
    if: ${{ github.event.inputs.aw2 == 'true' }}
    needs: [aw2-tools, aw2-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Train the pilot model
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 -u train.py ../../prep/shards --out ../../pilot.pt --minutes ${{ github.event.inputs.aw2_minutes }} --d ${{ github.event.inputs.aw2_width }} | tee ../../train.log
        python3 export.py --ckpt ../../pilot.pt --out ../../pilot.aw2m --version 1
        ls -la ../../pilot.aw2m
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-pilot-model
        path: pilot.aw2m
        retention-days: 7
    - name: Score AW1 against the pilot on the held-out items
      run: |
        set -euo pipefail
        T="dotnet aw2-tools/AutoWarpEval.dll"
        mkdir -p results
        python3 - <<'PY'
        import glob, json, os, collections
        by = collections.defaultdict(list)
        for j in glob.glob("prep/eval/*.json"):
            by[json.load(open(j))["dataset"]].append(j)
        for k, v in by.items():
            os.makedirs(f"eval-sets/{k}", exist_ok=True)
            for j in v:
                for ext in (".json", ".wav"):
                    os.symlink(os.path.abspath(j[:-5] + ext), f"eval-sets/{k}/" + os.path.basename(j[:-5]) + ext)
        print({k: len(v) for k, v in by.items()})
        PY
        for s in $(ls eval-sets); do
          $T --dir eval-sets/$s --set $s --model pilot.aw2m --out results/$s.json
        done
        $T --generated --model pilot.aw2m --out results/generated.json
        python3 tools/aw2/score2.py results/*.json --out aw2-pilot-report.md --csv aw2-pilot-per-file.csv
    - name: Time a 10-minute file with the pilot model
      run: |
        dotnet aw2-tools/AutoWarpEval.dll --bench pilot.aw2m 600 | tee timing-pilot.txt
    - name: Job summary
      if: always()
      run: |
        for f in aw2-pilot-report.md timing-pilot.txt train.log; do [ -f $f ] && { echo "## $f"; tail -c 60000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2-pilot-report
        path: |
          aw2-pilot-report.md
          aw2-pilot-per-file.csv
          results/
          timing-pilot.txt
          train.log
          prep/licences/
        retention-days: 14

  aw2-cleanup:
    needs: [aw2-train]
    if: ${{ always() && github.event.inputs.aw2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
    - name: Delete the intermediate artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate --jq '.artifacts[] | select(.name=="aw2-tools" or (.name|startswith("prep-"))) | .id'); do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id && echo "deleted $id"
        done

  # ---------------------------------------------------------------------------------------- AW2b
  # Full data (CC BY, CC BY 3.0 and CC0 only; licences are checked and logged by tools/aw2/fetch.py and fetch_slakh.py), two chained training jobs, thresholds set on the
  # validation split, the held-out test halves scored once with them. Nothing is committed; the artifacts are deleted by aw2b-cleanup.
  aw2b-prep:
    if: ${{ github.event.inputs.aw2b == 'true' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gmd, set: gmd, part: 0, variants: 2 }
          - { name: guitarset, set: guitarset, part: 0, variants: 2 }
          - { name: candombe, set: candombe, part: 0, variants: 2 }
          - { name: fsl10k, set: fsl10k, part: 0, variants: 2 }
          - { name: aam0, set: aam, part: 0, variants: 1 }
          - { name: aam1, set: aam, part: 1, variants: 1 }
          - { name: aam2, set: aam, part: 2, variants: 1 }
          - { name: generated, set: generated, part: 0, variants: 0 }
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Fetch and prepare
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        if [ "${{ matrix.set }}" = "generated" ]; then
          dotnet aw2-tools/AutoWarpEval.dll --gen-train /mnt/aw2/items 240
        else
          cd tools/aw2
          extra=""; limit="${{ github.event.inputs.aw2_limit }}"
          if [ "${{ matrix.set }}" = "aam" ]; then extra="--stems 20 --part ${{ matrix.part }}"; limit="${{ github.event.inputs.aw2b_aam }}"; fi
          python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit "$limit" $extra
          cd ../..
        fi
        mkdir -p prep-out/shards prep-out/eval prep-out/licences
        cd tools/aw2
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants ${{ matrix.variants }} \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/${{ matrix.name }}-licences.tsv
        if [ -f /mnt/aw2/items/attribution.tsv ]; then cp /mnt/aw2/items/attribution.tsv ../../prep-out/licences/${{ matrix.name }}-attribution.tsv; fi
        du -sh ../../prep-out/* | cat
    - uses: actions/upload-artifact@v6
      with:
        name: prep-${{ matrix.name }}
        path: |
          prep-out/shards
          prep-out/licences
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: evalprep-${{ matrix.name }}
        path: |
          prep-out/eval
          prep-out/licences
        retention-days: 1

  aw2b-slakh:
    if: ${{ github.event.inputs.aw2b == 'true' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Stream Slakh2100 (one resumable stream), build the items and the shards
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile requests pretty_midi
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        start=$(date +%s)
        python3 -u fetch_slakh.py /mnt/aw2/slakh --max-bytes $(( ${{ github.event.inputs.aw2b_slakh_gb }} * 1000000000 )) --max-seconds $(( ${{ github.event.inputs.aw2b_slakh_min }} * 60 )) --stem-share 0 --build-items /mnt/aw2/items | tee ../../slakh-stream.txt
        echo "stream and items: $(( $(date +%s) - start )) s" | tee -a ../../slakh-stream.txt
        rm -rf /mnt/aw2/slakh
        mkdir -p ../../prep-out/shards ../../prep-out/eval ../../prep-out/licences
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants 1 \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/slakh-licences.tsv
        du -sh ../../prep-out/* | cat
    - uses: actions/upload-artifact@v6
      with:
        name: prep-slakh
        path: |
          prep-out/shards
          prep-out/licences
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: evalprep-slakh
        path: |
          prep-out/eval
          prep-out/licences
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: slakh-stream-report
        path: slakh-stream.txt
        retention-days: 14

  aw2b-train1:
    needs: [aw2-tools, aw2b-prep, aw2b-slakh]
    if: ${{ always() && github.event.inputs.aw2b == 'true' && needs.aw2b-prep.result == 'success' && needs.aw2b-slakh.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - name: Train, first half of the schedule
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        T=${{ github.event.inputs.aw2b_train }}
        python3 -u train.py ../../prep/shards --out ../../ckpt.pt --minutes $T --total-minutes $(( 2 * T )) --d ${{ github.event.inputs.aw2_width }} | tee ../../train1.log
    - uses: actions/upload-artifact@v6
      with:
        name: aw2b-ckpt
        path: |
          ckpt.pt
          train1.log
        retention-days: 2

  aw2b-train2:
    needs: [aw2b-train1]
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2b-ckpt
        path: ck
    - name: Train, second half (resumed from the checkpoint)
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        T=${{ github.event.inputs.aw2b_train }}
        cp ../../ck/ckpt.pt ../../ckpt.pt
        python3 -u train.py ../../prep/shards --out ../../ckpt.pt --resume --minutes $T --total-minutes $(( 2 * T )) --d ${{ github.event.inputs.aw2_width }} | tee ../../train2.log
        python3 export.py --ckpt ../../ckpt.pt --out ../../final.aw2m --version 2
        ls -la ../../final.aw2m
    - uses: actions/upload-artifact@v6
      with:
        name: aw2b-model
        path: |
          final.aw2m
          train2.log
          ck/train1.log
        retention-days: 7

  aw2b-eval:
    needs: [aw2-tools, aw2b-train2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: evalprep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - uses: actions/download-artifact@v7
      with:
        name: aw2b-model
        path: model
    - name: Tune the DSP-or-model thresholds on the validation split, then score the test halves once
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        T="dotnet aw2-tools/AutoWarpEval.dll"
        python3 - <<'PY'
        import glob, json, os
        for j in glob.glob("prep/eval/*.json"):
            m = json.load(open(j)); half = "val" if m.get("split") == "val" else "test"
            k = "genval" if m["dataset"] == "generated" else m["dataset"]
            d = f"eval-sets/{half}-{k}"
            os.makedirs(d, exist_ok=True)
            for ext in (".json", ".wav"):
                os.symlink(os.path.abspath(j[:-5] + ext), d + "/" + os.path.basename(j[:-5]) + ext)
        print(sorted(os.listdir("eval-sets")))
        PY
        for s in 0.005 0.01 0.02; do for g in 0.02 0.04; do
          mkdir -p tuning/${s}_${g}
          for d in eval-sets/val-*; do $T --dir $d --set $(basename $d | sed 's/^val-//') --model model/final.aw2m --dsp-steady $s --dsp-agree $g --out tuning/${s}_${g}/$(basename $d).json; done
        done; done
        python3 tools/aw2/tune.py tuning --out tune.json
        S=$(python3 -c "import json;print(json.load(open('tune.json'))['steady'])"); G=$(python3 -c "import json;print(json.load(open('tune.json'))['agree'])")
        mkdir -p results
        for d in eval-sets/test-*; do $T --dir $d --set $(basename $d | sed 's/^test-//') --model model/final.aw2m --dsp-steady $S --dsp-agree $G --out results/$(basename $d).json; done
        for d in eval-sets/val-*; do $T --dir $d --set $(basename $d | sed 's/^val-//') --model model/final.aw2m --dsp-steady $S --dsp-agree $G --out results/$(basename $d).json; done
        $T --generated --model model/final.aw2m --dsp-steady $S --dsp-agree $G --out results/generated.json
        python3 tools/aw2/score2.py results/*.json --out aw2b-report.md --csv aw2b-per-file.csv
    - name: Time a 10-minute file with the final model
      run: |
        dotnet aw2-tools/AutoWarpEval.dll --bench model/final.aw2m 600 | tee timing-final.txt
    - name: Job summary
      if: always()
      run: |
        for f in aw2b-report.md timing-final.txt tune.json; do [ -f $f ] && { echo "## $f"; tail -c 60000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2b-report
        path: |
          aw2b-report.md
          aw2b-per-file.csv
          results/
          tune.json
          tuning/
          timing-final.txt
          prep/licences/
        retention-days: 14

  aw2b-cleanup:
    needs: [aw2b-eval]
    if: ${{ always() && github.event.inputs.aw2b == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
    - name: Delete the intermediate artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate --jq '.artifacts[] | select(.name=="aw2-tools" or .name=="aw2b-ckpt" or (.name|startswith("prep-")) or (.name|startswith("evalprep-"))) | .id'); do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id && echo "deleted $id"
        done

  aw2b-pack:
    if: ${{ github.event.inputs.aw2b_pack == 'true' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Timing of the shipped model
      run: |
        dotnet aw2-tools/AutoWarpEval.dll --bench embedded 600 | tee timing-shipped.txt
    - name: A few held-out items (the test split, by the same rules as the data jobs), the listening pack
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        for s in gmd guitarset candombe; do python3 fetch.py $s /mnt/aw2/items-$s --limit 40; done
        python3 fetch.py aam /mnt/aw2/items-aam --limit 24 --part 1
        cd ../..
        python3 - <<'PY'
        import glob, json, os
        want = [("gmd", "gmd_drummer5_session2_1", 100), ("gmd", "gmd_drummer5_session2_2", 110), ("guitarset", "gs_04_BN3-154-E_solo", 105), ("guitarset", "gs_04_Funk3-112-C#_comp", 115),
                ("candombe", "cd_csic.1995_ansina2_03", 90), ("candombe", "cd_csic.1995_cuareim_03", 140), ("aam", "aam_1006", 105), ("aam", "aam_1066", 100)]
        rows, readme = [], ["Auto-warp listening pack (fixed list): the same eight held-out clips as the AW2 blind test (never trained on), a 40 s window, played at the song tempo against a click on the song's grid", "(a higher, louder tick on each bar line), warped with Signalsmith Stretch (the library of the app's Pro warp, so the pitch stays put).", "--model is the beat model compiled into this build, with its DSP-or-model choice.", ""]
        for ds, name, bpm in want:
            j = f"/mnt/aw2/items-{ds}/{name}.json"
            m = json.load(open(j))
            assert m["split"] == "test", name
            rows.append(f"{j[:-5]}.wav\t{bpm}")
            readme.append(f"{len(rows):02d}-{name}: {m['source']}; licence {m['licence']}; song tempo {bpm} BPM")
        open("pack-list.txt", "w").write("\n".join(rows) + "\n")
        open("pack-readme.txt", "w").write("\n".join(readme) + "\n")
        PY
        AW2_PACK_ALL=1 dotnet aw2-tools/AutoWarpEval.dll --pack2 aw2-pack embedded aw2-tools/aw2warp pack-list.txt 8 | tee pack-log.txt
        cp pack-readme.txt aw2-pack/README.txt
        cat pack-log.txt >> aw2-pack/README.txt
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2-pack
        path: |
          aw2-pack/
          timing-shipped.txt
        retention-days: 14

  aw2c-measure:
    if: ${{ github.event.inputs.aw2c_measure == 'true' || github.event.inputs.aw2c_measure == 'check' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Fetch the measure-only sets (runner only) and score AW1 and the model
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        python3 -u tools/aw2/measure.py /mnt/aw2/measure gtzan ballroom 2>&1 | tee measure-log.txt
        if [ "${{ github.event.inputs.aw2c_measure }}" = "check" ]; then ls /mnt/aw2/measure/* | head -5 | tee -a measure-log.txt; exit 0; fi
        mkdir -p results
        for s in gtzan ballroom; do
          if ls /mnt/aw2/measure/$s/*.json > /dev/null 2>&1; then
            dotnet aw2-tools/AutoWarpEval.dll --dir /mnt/aw2/measure/$s --set $s --model embedded --out results/$s.json
          else
            echo "$s: no items (skipped)" | tee -a measure-log.txt
          fi
        done
        if ls results/*.json > /dev/null 2>&1; then python3 tools/aw2/score2.py results/*.json --out measure-report.md; fi
        # Only the metrics table is kept: no audio, no per-file results, no labels.
        rm -rf /mnt/aw2/measure results
    - name: Job summary
      if: always()
      run: |
        for f in measure-log.txt measure-report.md; do [ -f $f ] && { echo "## $f"; tail -c 20000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2c-measure-report
        path: |
          measure-report.md
          measure-log.txt
        retention-days: 14

  # ---------------------------------------------------------------------------------------- AW2c
  aw2c-prep:
    if: ${{ github.event.inputs.aw2c == 'true' }}
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gmd, set: gmd, limit: 1000, args: '', variants: 2 }
          - { name: egmd, set: egmd, limit: 860, args: '', variants: 1 }
          - { name: guitarset, set: guitarset, limit: 500, args: '', variants: 2 }
          - { name: candombe, set: candombe, limit: 400, args: '', variants: 2 }
          - { name: fsl10k, set: fsl10k, limit: 160, args: '', variants: 2 }
          - { name: generated, set: generated, limit: 0, args: '', variants: 0 }
          - { name: aamnew, set: aam, limit: 50, args: '--part 2 --offset 3 --stems 10', variants: 1 }
          - { name: aamev0, set: aam, limit: 24, args: '--part 0 --offset 1 --eval-only', variants: 0 }
          - { name: aamev1, set: aam, limit: 24, args: '--part 1 --offset 1 --eval-only', variants: 0 }
          - { name: aamev2, set: aam, limit: 24, args: '--part 2 --offset 1 --eval-only', variants: 0 }
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Fetch and prepare
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        if [ "${{ matrix.set }}" = "generated" ]; then
          dotnet aw2-tools/AutoWarpEval.dll --gen-train /mnt/aw2/items 240
        else
          (cd tools/aw2 && python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit ${{ matrix.limit }} ${{ matrix.args }})
        fi
        mkdir -p prep-out/shards prep-out/eval prep-out/licences
        cd tools/aw2
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants ${{ matrix.variants }} \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/${{ matrix.name }}-licences.tsv
        if [ -f /mnt/aw2/items/attribution.tsv ]; then cp /mnt/aw2/items/attribution.tsv ../../prep-out/licences/${{ matrix.name }}-attribution.tsv; fi
        du -sh ../../prep-out/* | cat
    - uses: actions/upload-artifact@v6
      with:
        name: prep-${{ matrix.name }}
        path: |
          prep-out/shards
          prep-out/licences
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: evalprep-${{ matrix.name }}
        path: |
          prep-out/eval
          prep-out/licences
        retention-days: 1

  aw2c-train1:
    needs: [aw2-tools, aw2c-prep]
    if: ${{ always() && github.event.inputs.aw2c == 'true' && needs.aw2c-prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - name: Continue the shipped model, first half of the schedule
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 - <<'PY'
        import base64, re
        d = open("../../ReBuzz/Core/Clips/BeatModelData.cs").read()
        open("../../shipped.aw2m", "wb").write(base64.b64decode("".join(re.findall(r'^\s+"([A-Za-z0-9+/=]+)",$', d, re.M))))
        PY
        T=${{ github.event.inputs.aw2b_train }}
        python3 -u train.py ../../prep/shards --out ../../ckpt.pt --init ../../shipped.aw2m --lr 3e-4 --minutes $T --total-minutes $(( 2 * T )) --seed 4321 | tee ../../train1.log
    - uses: actions/upload-artifact@v6
      with:
        name: aw2c-ckpt
        path: |
          ckpt.pt
          train1.log
        retention-days: 2

  aw2c-train2:
    needs: [aw2c-train1]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2c-ckpt
        path: ck
    - name: Second half (resumed)
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        cp ../../ck/ckpt.pt ../../ckpt.pt
        T=${{ github.event.inputs.aw2b_train }}
        python3 -u train.py ../../prep/shards --out ../../ckpt.pt --resume --lr 3e-4 --minutes $T --total-minutes $(( 2 * T )) --seed 4321 | tee ../../train2.log
        python3 export.py --ckpt ../../ckpt.pt --out ../../cand.aw2m --version 3
    - uses: actions/upload-artifact@v6
      with:
        name: aw2c-model
        path: |
          cand.aw2m
          train2.log
          ck/train1.log
        retention-days: 7

  aw2c-eval:
    needs: [aw2-tools, aw2c-train2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: evalprep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - uses: actions/download-artifact@v7
      with:
        name: aw2c-model
        path: model
    - name: Tune the tempo prior and the phase check on validation (candidate), then the shipped model and the candidate on the same items
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        T="dotnet aw2-tools/AutoWarpEval.dll"
        python3 - <<'PY'
        import glob, json, os
        for j in glob.glob("prep/eval/*.json"):
            m = json.load(open(j)); half = "val" if m.get("split") == "val" else "test"
            k = "genval" if m["dataset"] == "generated" else m["dataset"]
            d = f"eval-sets/{half}-{k}"
            os.makedirs(d, exist_ok=True)
            for ext in (".json", ".wav"):
                os.symlink(os.path.abspath(j[:-5] + ext), d + "/" + os.path.basename(j[:-5]) + ext)
        print(sorted(os.listdir("eval-sets")))
        PY
        # the grid: the tempo prior's sigma (0 = off) and the phase check's ratio (0 = off); the DSP thresholds stay as shipped
        for s in 0 0.6 0.35; do for g in 0 0.6; do
          mkdir -p tuning/${s}_${g}
          for d in eval-sets/val-*; do $T --dir $d --set $(basename $d | sed 's/^val-//') --model model/cand.aw2m --tempo-prior $s --dsp-phase $g --out tuning/${s}_${g}/$(basename $d).json; done
        done; done
        python3 tools/aw2/tune.py tuning --out tune.json
        P=$(python3 -c "import json;print(json.load(open('tune.json'))['steady'])"); G=$(python3 -c "import json;print(json.load(open('tune.json'))['agree'])")
        mkdir -p res-shipped res-cand
        for d in eval-sets/*; do
          s=$(basename $d | sed 's/^[a-z]*-//')
          $T --dir $d --set $s --model embedded --out res-shipped/$(basename $d).json
          $T --dir $d --set $s --model model/cand.aw2m --tempo-prior $P --dsp-phase $G --out res-cand/$(basename $d).json
        done
        $T --generated --model embedded --out res-shipped/generated.json
        $T --generated --model model/cand.aw2m --tempo-prior $P --dsp-phase $G --out res-cand/generated.json
        python3 tools/aw2/score2.py res-shipped/*.json --out report-shipped.md --csv per-file-shipped.csv
        python3 tools/aw2/score2.py res-cand/*.json --out report-cand.md --csv per-file-cand.csv
    - name: Time the candidate
      run: dotnet aw2-tools/AutoWarpEval.dll --bench model/cand.aw2m 600 | tee timing-cand.txt
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2c-report
        path: |
          report-shipped.md
          report-cand.md
          per-file-shipped.csv
          per-file-cand.csv
          tune.json
          tuning/
          timing-cand.txt
          prep/licences/
        retention-days: 14

  aw2c-cleanup:
    needs: [aw2c-eval]
    if: ${{ always() && github.event.inputs.aw2c == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
    - name: Delete the intermediate artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate --jq '.artifacts[] | select(.name=="aw2-tools" or .name=="aw2c-ckpt" or (.name|startswith("prep-")) or (.name|startswith("evalprep-"))) | .id'); do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id && echo "deleted $id"
        done

  # ---------------------------------------------------------------------------------------- AW3
  # The items of the validation and test halves of the AW2 sets (nothing else is fetched), kept in the Actions cache by set; no audio leaves the runner but as one-day artifacts.
  aw3-items:
    if: ${{ github.event.inputs.aw3 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gmd, set: gmd, part: 0 }
          - { name: guitarset, set: guitarset, part: 0 }
          - { name: candombe, set: candombe, part: 0 }
          - { name: aam0, set: aam, part: 0 }
          - { name: aam1, set: aam, part: 1 }
          - { name: aam2, set: aam, part: 2 }
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Items from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: aw3-items
        key: aw3-items-v1-${{ matrix.name }}
    - name: Fetch the validation and test items
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        extra=""; limit=1000
        if [ "${{ matrix.set }}" = "aam" ]; then extra="--part ${{ matrix.part }}"; limit=150; fi
        python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit "$limit" --eval-only $extra
        mkdir -p ../../aw3-items
        python3 prep.py /mnt/aw2/items ../../aw3-items/shards-unused --eval-dir ../../aw3-items/eval --variants 0 --eval-exe none --warp none
        rm -rf ../../aw3-items/shards-unused
        ls ../../aw3-items/eval | wc -l
        du -sh ../../aw3-items
    - uses: actions/upload-artifact@v6
      with:
        name: aw3-items-${{ matrix.name }}
        path: aw3-items/eval
        retention-days: 1

  aw3-eval:
    if: ${{ contains(github.event.inputs.aw3, 'sweep') }}
    needs: aw3-items
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        pattern: aw3-items-*
        path: items
    - name: Build the tool
      run: dotnet build tools/AutoWarpEval -c Release -o aw3-tool 2>&1 | tail -3
    - name: Sweep the settings, score
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval
        mkdir -p results sets
        for set in gmd guitarset candombe aam; do mkdir -p sets/$set; done
        cp items/aw3-items-gmd/* sets/gmd/; cp items/aw3-items-guitarset/* sets/guitarset/; cp items/aw3-items-candombe/* sets/candombe/
        for p in 0 1 2; do cp items/aw3-items-aam$p/* sets/aam/; done
        ARGS="${{ github.event.inputs.aw3 }}"
        half=$(echo "$ARGS" | grep -o 'half=[^ ]*' | cut -d= -f2 || true); half=${half:-val}
        reach=$(echo "$ARGS" | grep -o 'reach=[^ ]*' | cut -d= -f2 || true); reach=${reach:-0,25,35}
        resid=$(echo "$ARGS" | grep -o 'resid=[^ ]*' | cut -d= -f2 || true); resid=${resid:-inf:inf,30:60,20:40,15:30}
        echo "half $half reach $reach resid $resid"
        for set in gmd guitarset candombe aam; do
          dotnet aw3-tool/AutoWarpEval.dll --aw3 sets/$set $set embedded results/$set.json --half "$half" --reach "$reach" --resid "$resid" --onsets
        done
        python3 tools/aw2/aw3score.py results/*.json --out aw3-report.md --csv aw3-per-file.csv --hist-sets gmd,guitarset,candombe,aam
    - name: Job summary
      if: always()
      run: |
        [ -f aw3-report.md ] && { echo "## aw3-report.md"; tail -c 60000 aw3-report.md; } >> "$GITHUB_STEP_SUMMARY" || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw3-report
        path: |
          aw3-report.md
          aw3-per-file.csv
          results/
        retention-days: 14

  aw3-pack:
    if: ${{ contains(github.event.inputs.aw3, 'pack') }}
    needs: aw3-items
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        pattern: aw3-items-*
        path: items
    - name: Build the tools
      run: |
        dotnet build tools/AutoWarpEval -c Release -o aw3-tool 2>&1 | tail -3
        g++ -O2 -std=c++17 -I NeoStretch/third_party tools/aw2/warp.cpp -o aw3-tool/aw2warp
    - name: The pack list and the renders
      env:
        AW3_REACH: '25'
        AW3_P95: '30'
        AW3_MAX: '60'
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        mkdir -p all; for d in items/*; do cp $d/* all/; done
        python3 tools/aw2/aw3packlist.py all pack-list.txt pack-readme.txt
        dotnet aw3-tool/AutoWarpEval.dll --pack3 aw3-pack aw3-tool/aw2warp pack-list.txt | tee pack-log.txt
        cp pack-readme.txt aw3-pack/README.txt
        cat pack-log.txt >> aw3-pack/README.txt
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw3-pack
        path: aw3-pack/
        retention-days: 14

  # ---------------------------------------------------------------------------------------- AW4
  # The pretrained beat and downbeat network (docs/specs/neo-audio.md, AW4 as built; 3rdParty/beat-this). The weights are never committed: bt-model fetches the pinned upstream
  # checkpoint (SHA-256 checked), exports it to ONNX and checks the export against PyTorch; the other bt-* jobs take that file. Dispatch with the aw3 input set to one or more of
  # bt-parity, bt-eval, bt-measure, bt-speed, bt-listen (bt-eval, bt-parity and bt-listen also run the aw3-items job: the held-out items).
  bt-model:
    if: ${{ contains(github.event.inputs.aw3, 'bt-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Fetch the pinned checkpoint, export it, check the export
      run: |
        set -euo pipefail
        pip install --quiet torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --quiet -r tools/autowarp/beat_this_requirements.txt
        pip list 2>/dev/null | grep -i -E "^(torch|torchaudio|beat|onnx|onnxruntime|numpy|einops|rotary|soxr) " | tee bt-model-log.txt
        python3 tools/autowarp/beat_this_model.py fetch bt-model 2>&1 | grep -v -i warn | tee -a bt-model-log.txt
        rm -f bt-model/*.ckpt
        { echo "## bt-model"; cat bt-model-log.txt; } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: bt-model
        path: |
          bt-model/
          bt-model-log.txt
        retention-days: 7

  bt-parity:
    if: ${{ contains(github.event.inputs.aw3, 'bt-parity') }}
    needs: [aw3-items, bt-model]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        pattern: aw3-items-*
        path: items
    - uses: actions/download-artifact@v7
      with:
        name: bt-model
        path: bt-model
    - name: Build the tool
      run: dotnet build tools/AutoWarpEval -c Release -o aw4-tool 2>&1 | tail -3
    - name: The upstream package against ours (spectrogram within 1e-4, beats and downbeats within a frame)
      run: |
        set -euo pipefail
        pip install --quiet torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --quiet -r tools/autowarp/beat_this_requirements.txt
        mkdir -p parity
        # Three test items of each set (the first, a middle and the last of the sorted names), and one 44.1 kHz generated line (the resampling path: beats only).
        for d in items/aw3-items-gmd items/aw3-items-guitarset items/aw3-items-candombe items/aw3-items-aam0; do
          python3 - "$d" parity <<'PY'
        import glob, json, os, shutil, sys
        d, out = sys.argv[1:3]
        names = sorted(os.path.basename(j)[:-5] for j in glob.glob(f"{d}/*.json") if json.load(open(j)).get("split") == "test")
        for n in {names[0], names[len(names) // 2], names[-1]}:
            shutil.copy(f"{d}/{n}.wav", out)
        PY
        done
        dotnet aw4-tool/AutoWarpEval.dll --dump Drift Mix 0 parity/generated_drift_mix.wav
        python3 tools/autowarp/beat_this_model.py reference bt-ref parity/*.wav 2>&1 | grep -v -i warn
        dotnet aw4-tool/AutoWarpEval.dll --bt-parity bt-model/bt-model/beat_this_small.onnx bt-ref parity/*.wav | tee bt-parity-log.txt
    - name: Job summary
      if: always()
      run: '[ -f bt-parity-log.txt ] && { echo "## bt-parity"; cat bt-parity-log.txt; } >> "$GITHUB_STEP_SUMMARY" || true'
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: bt-parity
        path: bt-parity-log.txt
        retention-days: 14

  bt-eval:
    if: ${{ contains(github.event.inputs.aw3, 'bt-eval') }}
    needs: [aw3-items, bt-model]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        pattern: aw3-items-*
        path: items
    - uses: actions/download-artifact@v7
      with:
        name: bt-model
        path: bt-model
    - name: Build the tool
      run: dotnet build tools/AutoWarpEval -c Release -o aw4-tool 2>&1 | tail -3
    - name: AW1, AW2, AW3 and the pretrained network on the test halves, score
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval
        mkdir -p results sets
        for set in gmd guitarset candombe aam; do mkdir -p sets/$set; done
        cp items/aw3-items-gmd/* sets/gmd/; cp items/aw3-items-guitarset/* sets/guitarset/; cp items/aw3-items-candombe/* sets/candombe/
        for p in 0 1 2; do cp items/aw3-items-aam$p/* sets/aam/; done
        echo "cores: $(nproc)"
        for set in gmd guitarset candombe aam; do
          dotnet aw4-tool/AutoWarpEval.dll --aw4 sets/$set $set bt-model/bt-model/beat_this_small.onnx results/$set.json --half test --reach 0,25 --onsets
        done
        python3 tools/aw2/aw4score.py results/*.json --out aw4-report.md --csv aw4-per-file.csv --half test
    - name: Job summary
      if: always()
      run: '[ -f aw4-report.md ] && { echo "## aw4-report.md"; tail -c 60000 aw4-report.md; } >> "$GITHUB_STEP_SUMMARY" || true'
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw4-report
        path: |
          aw4-report.md
          aw4-per-file.csv
          results/
        retention-days: 14

  bt-measure:
    if: ${{ contains(github.event.inputs.aw3, 'bt-measure') }}
    needs: bt-model
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: bt-model
        path: bt-model
    - name: Build the tool
      run: dotnet build tools/AutoWarpEval -c Release -o aw4-tool 2>&1 | tail -3
    - name: Fetch GTZAN and Ballroom (runner only, never kept), score
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        python3 -u tools/aw2/measure.py /mnt/aw2/measure gtzan ballroom 2>&1 | tee measure-log.txt
        mkdir -p results
        for s in gtzan ballroom; do
          if ls /mnt/aw2/measure/$s/*.json > /dev/null 2>&1; then
            dotnet aw4-tool/AutoWarpEval.dll --aw4 /mnt/aw2/measure/$s $s bt-model/bt-model/beat_this_small.onnx results/$s.json --half test --reach 0,25 --onsets
          else
            echo "$s: no items (skipped)" | tee -a measure-log.txt
          fi
        done
        python3 tools/aw2/aw4score.py results/*.json --out aw4-measure-report.md --half test --clips ""
        # Only the metrics table is kept: no audio, no per-file results, no labels.
        rm -rf /mnt/aw2/measure results
    - name: Job summary
      if: always()
      run: |
        for f in measure-log.txt aw4-measure-report.md; do [ -f $f ] && { echo "## $f"; tail -c 20000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw4-measure-report
        path: |
          aw4-measure-report.md
          measure-log.txt
        retention-days: 14

  bt-speed:
    if: ${{ contains(github.event.inputs.aw3, 'bt-speed') }}
    needs: bt-model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: bt-model
        path: bt-model
    - name: A 10-minute file, all included (decoding, spectrogram, network, markers)
      run: |
        set -euo pipefail
        dotnet build tools/AutoWarpEval -c Release -o aw4-tool 2>&1 | tail -3
        { echo "cores: $(nproc)"; lscpu | grep -E "Model name"; } | tee bt-speed-log.txt
        dotnet aw4-tool/AutoWarpEval.dll --bt-bench bt-model/bt-model/beat_this_small.onnx 600 | tee -a bt-speed-log.txt
        { echo "## bt-speed"; cat bt-speed-log.txt; } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: bt-speed
        path: bt-speed-log.txt
        retention-days: 14

  bt-listen:
    if: ${{ contains(github.event.inputs.aw3, 'bt-listen') }}
    needs: [aw3-items, bt-model]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        pattern: aw3-items-*
        path: items
    - uses: actions/download-artifact@v7
      with:
        name: bt-model
        path: bt-model
    - name: Build the tools
      run: |
        dotnet build tools/AutoWarpEval -c Release -o aw4-tool 2>&1 | tail -3
        g++ -O2 -std=c++17 -I NeoStretch/third_party tools/aw2/warp.cpp -o aw4-tool/aw2warp
    - name: The round-3 pack (the 16 clips of round 2, the new source and AW2 as shipped)
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile
        mkdir -p all; for d in items/*; do case "$d" in */bt-model) ;; *) cp $d/* all/ ;; esac; done
        python3 tools/aw2/aw4packlist.py all pack-list.txt pack-readme.txt
        dotnet aw4-tool/AutoWarpEval.dll --pack4 aw4-renders aw4-tool/aw2warp pack-list.txt bt-model/bt-model/beat_this_small.onnx | tee pack-log.txt
        cp pack-readme.txt pack-list.txt pack-log.txt aw4-renders/
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw4-renders
        path: aw4-renders/
        retention-days: 14
