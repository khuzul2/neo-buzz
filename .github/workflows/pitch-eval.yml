name: Pitch evaluation

# The shared pitch engine (docs/specs/pitch.md, phase PT1) scored on real recordings. By hand only (workflow_dispatch). The data are
# downloaded here, on the runner, from Zenodo, each file checked against the checksum Zenodo publishes for it; they are never
# committed and never uploaded. What the run keeps is a Markdown report (the job summary and an artifact) and a CSV of the
# per-stem figures.
#  - MDB-stem-synth (zenodo.org/records/1481172, CC BY-NC 4.0, 1.8 GB): raw pitch and chroma accuracy, voicing recall and false
#    alarm, overall accuracy, per stem and overall, for each range and for Low latency against Quality.
#  - Amateur Vocal Percussion (zenodo.org/record/5036529, CC BY 4.0, 231 MB): onset F-measure and latency, trigger accuracy trained
#    on 10 hits per class per participant.
#  - VocalSet 1.1 (zenodo.org/records/1442513, CC BY 4.0, 2 GB zip read in place): a subset of techniques and vowels; voicing, octave
#    jumps, held-note stability, Low latency against Quality, and the vowel estimator on the labelled vowels.
#  - Neo Tune (docs/specs/neo-tune.md §9 and §11) on the same VocalSet subset: the pitch of the corrected output against the nearest scale note
#    before and after, voicing kept, an artefact proxy, and the NT2 quality gates (vibrato kept, jitter and shimmer, long-term spectrum,
#    sub-harmonics, bursts, note sequence, null) for NT1 (the engine frozen in tools/PitchEval/TuneNt1) and NT2 at Natural 0, 50 and 100.
#    A listening pack (six excerpts of at most 8 s: original, NT1's old output, NT2 at Natural 0/50/100, levels matched, a blind folder with a
#    key, the CC BY 4.0 attribution in the README) is uploaded as the artifact neo-tune-excerpts. No audio is committed.
# The tool is tools/PitchEval (it links Machines/NeoBuzz.Dsp and nothing else).
#
# The am1 job (docs/specs/audio-to-midi.md section 8) scores Neo Audio to MIDI's engine as the machine runs it (tools/PitchEval --am1-*):
#  - GuitarSet (zenodo.org/records/3371780, CC BY 4.0): the hexaphonic pickup's per-string lines (a spread of the recordings, read by range requests
#    into the zip: tools/am1/fetch_guitarset.py) against the JAMS note annotation of each string: Melody note F-measure and latency, Fast and Stable.
#  - IDMT-SMT-Drums (zenodo.org/records/7544164, CC BY-NC-ND 4.0, 287 MB; evaluation only): kick, snare and hat F-measure and timing in the drum mixes,
#    with the built-in rules and calibrated from five hits of each drum of the same kit.
#  - MDB-stem-synth again: Melody note F-measure and the pitch right on the voiced frames.
#  - Piano-roll plots (annotated against played) of three excerpts of each mode, uploaded as the artifact am1-plots.
#
# The autowarp job (docs/specs/neo-audio.md, AW1 as built) scores the beat and downbeat tracker behind Auto-warp (tools/AutoWarpEval, tools/autowarp):
#  - Groove MIDI Dataset (CC BY 4.0) and Slakh2100 (Zenodo 4599666, CC BY 4.0), read by range requests and as a stream (tools/autowarp/fetch_data.py); the ground
#    truth beats and downbeats come from the MIDI. The generated lines of the repo (steady, drift, step, ritardando; drums, mix, pad) and steady loops.
#  - Beat F at +-70 ms, CMLt, AMLt (mir_eval, MIT), downbeat F and the grid error after warping, for auto-warp against today's steady detection; half of each set is held out.
#  - Uploads the report, and the listening pack (two performances and the drift and step lines, steady against auto-warp, on a click) as the artifact autowarp-pack.
#
# The convert job (docs/specs/pitch.md section 9.6) scores Convert to MIDI, the converters as the app runs them (tools/ConvertEval):
#  - MDB-stem-synth again: note F-measure of the melody converter (onset +-50 ms, pitch +-50 cents; the reference notes cut from the annotated f0).
#  - Groove MIDI Dataset (Magenta, CC BY 4.0), the test split read by HTTP range requests (tools/convert/fetch_data.py): per-class onset F-measure of the drum converter.
#  - Drums on other kits (CD1; the drum classifier was fitted on the Groove train split, one electronic kit): IDMT-SMT-Drums (Zenodo 7544164, CC BY-NC-ND 4.0; real, techno
#    and wave kits) and MDB Drums (CC BY-NC-SA 4.0; acoustic, with toms and cymbals), AM2's rules against the CD1 network, per class, with the gate of docs/specs/pitch.md section 9.9.
#  - MAESTRO v3.0.0 (Magenta, CC BY-NC-SA 4.0), 60-second excerpts by range requests: note F-measure of the harmony converter (Basic Pitch),
#    and its agreement with the Python basic_pitch package on the same files and model.

# The aw2-* jobs (docs/specs/neo-audio.md, AW2 as built) train and score the beat and downbeat model of Auto-warp. Off unless `aw2` is set (turn the other jobs off when dispatching them).
# Training data are CC BY, CC BY 3.0 or CC0 only, fetched here with the licence of every file checked (tools/aw2/fetch.py, fetch_slakh.py); nothing is committed or kept.
#  - aw2-tools: builds tools/AutoWarpEval (the feature tool, the evaluation) and tools/aw2/warp.cpp (Signalsmith Stretch, MIT), checks the label mapping of the warp, the C# forward pass
#    against PyTorch and the time of a 10-minute file with random weights of d=64 and d=96.
#  - aw2-prep (a matrix of five sets: GMD, GuitarSet, Candombe, AAM with stem dropout, FSL10K loops): fetch, warp and transpose, features by the app's own front end; held-out items are kept for
#    the evaluation. Kept in the Actions cache (keyed by set and feature version) and passed on as artifacts of one day.
#  - aw2-slakh: streams the first 5 GB of Slakh2100 with a forced reconnect (the tool of AW2b's full stream).
#  - aw2-train: a time-boxed CPU training, then AW1's DSP against the model on the held-out items (tools/aw2/score2.py), and the timing of a 10-minute file.
#  - aw2-cleanup: deletes the one-day artifacts.

on:
  workflow_dispatch:
    inputs:
      mdb:
        description: 'MDB-stem-synth'
        type: boolean
        default: true
      avp:
        description: 'Amateur Vocal Percussion'
        type: boolean
        default: true
      vocalset:
        description: 'VocalSet'
        type: boolean
        default: true
      tune:
        description: 'Neo Tune on VocalSet (needs the VocalSet download; writes the listening excerpts)'
        type: boolean
        default: true
      convert:
        description: 'Convert to MIDI (melody on MDB-stem-synth, drums on the Groove MIDI Dataset, harmony on MAESTRO)'
        type: boolean
        default: true
      maestro_count:
        description: 'Convert to MIDI: MAESTRO excerpts (60 s each)'
        type: string
        default: '10'
      am1:
        description: 'Neo Audio to MIDI (GuitarSet, IDMT-SMT-Drums and MDB-stem-synth through the machine engine, with piano-roll plots)'
        type: boolean
        default: true
      autowarp:
        description: 'Auto-warp (beats and downbeats on Groove MIDI Dataset, Slakh2100 and the generated lines, against today steady-tempo detection)'
        type: boolean
        default: true
      aw2:
        description: 'AW2 beat model: tools, prep, pilot training and evaluation (turn the other jobs off)'
        type: boolean
        default: false
      aw2_limit:
        description: 'AW2: items per training split in each set'
        type: string
        default: '100'
      aw2_variants:
        description: 'AW2: warped variants per training item'
        type: string
        default: '2'
      aw2_minutes:
        description: 'AW2: training time, minutes'
        type: string
        default: '55'
      aw2_width:
        description: 'AW2: model width d (64 or 96)'
        type: string
        default: '64'
      aw2_slakh:
        description: 'AW2: test the Slakh2100 stream (first 5 GB, forced reconnect)'
        type: string
        default: 'true'
      guitarset_every:
        description: 'Neo Audio to MIDI: one GuitarSet solo take of the held-out players 03 to 05 in this many (the tuning used players 00 to 02)'
        type: string
        default: '2'
      mdb_limit:
        description: 'MDB-stem-synth: evaluate only this many stems, evenly spread (0 = all 230)'
        type: string
        default: '0'
      vocalset_per_group:
        description: 'VocalSet: files per singer and technique'
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ github.event.inputs.mdb != 'false' || github.event.inputs.avp != 'false' || github.event.inputs.vocalset != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/pitch-eval-data
      # What the dispatch inputs say.
      RUN_MDB: ${{ github.event.inputs.mdb != 'false' }}
      RUN_AVP: ${{ github.event.inputs.avp != 'false' }}
      RUN_VOCALSET: ${{ github.event.inputs.vocalset != 'false' }}
      RUN_TUNE: ${{ github.event.inputs.tune != 'false' }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build the evaluation tool
      run: dotnet build tools/PitchEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # fetch <record> <file name> <destination>: Zenodo's API for the file's URL and md5, then the check.
    - name: Download and check the data
      run: |
        set -euo pipefail
        fetch() {
          local rec="$1" name="$2" dest="$3"
          local meta md5 try
          # Zenodo's API now and then answers with an error body: ask again (up to 8 times) until the file's checksum is in the answer.
          for try in 1 2 3 4 5 6 7 8; do
            meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
            md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
            [ -n "$md5" ] && break
            echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
          done
          [ -n "$md5" ] || { echo "no checksum for $name"; return 1; }
          echo "$rec $name md5 $md5; licence: $(echo "$meta" | python3 -c "import json,sys; print(json.load(sys.stdin)['metadata']['license'])" 2>/dev/null || echo unknown)"
          curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
          echo "$md5  $dest" | md5sum -c -
        }
        if [ "$RUN_MDB" = "true" ]; then
          fetch 1481172 MDB-stem-synth.tar.gz "$DATA/mdb.tar.gz"
          mkdir -p "$DATA/mdb"
          tar -xzf "$DATA/mdb.tar.gz" -C "$DATA/mdb" --exclude='*/._*'
          rm "$DATA/mdb.tar.gz"
        fi
        if [ "$RUN_AVP" = "true" ]; then
          fetch 5036529 AVP_Dataset.zip "$DATA/avp.zip"
          mkdir -p "$DATA/avp"
          unzip -q "$DATA/avp.zip" -x '__MACOSX/*' -d "$DATA/avp"
          rm "$DATA/avp.zip"
        fi
        if [ "$RUN_VOCALSET" = "true" ] || [ "$RUN_TUNE" = "true" ]; then
          fetch 1442513 VocalSet11.zip "$DATA/vocalset.zip"
        fi
        df -h /mnt | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        args=(--out pitch-eval-report.md --csv pitch-eval-stems.csv)
        [ "$RUN_MDB" = "true" ] && args+=(--mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}")
        [ "$RUN_AVP" = "true" ] && args+=(--avp "$DATA/avp")
        [ "$RUN_VOCALSET" = "true" ] && args+=(--vocalset "$DATA/vocalset.zip" --vocalset-per-group "${{ github.event.inputs.vocalset_per_group || '2' }}")
        # Neo Tune on the same subset; the excerpts go to a folder that is uploaded as its own artifact (nothing is committed).
        [ "$RUN_TUNE" = "true" ] && args+=(--tune "$DATA/vocalset.zip" --tune-excerpts neo-tune-excerpts)
        true
        dotnet run -c Release --no-build --project tools/PitchEval -- "${args[@]}"

    - name: Job summary
      if: always()
      run: |
        if [ -f pitch-eval-report.md ]; then
          # The summary is capped at 1 MiB: the per-stem table is in the artifact whole.
          head -c 900000 pitch-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report and the per-stem CSV (figures, no audio).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pitch-eval-report
        path: |
          pitch-eval-report.md
          pitch-eval-stems.csv
        if-no-files-found: ignore

    # Six before/after excerpts (at most 8 s each) of VocalSet (CC BY 4.0, the attribution is in their README) for listening.
    # An artifact of the run only: never committed.
    - name: Upload the listening excerpts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: neo-tune-excerpts
        path: neo-tune-excerpts
        if-no-files-found: ignore

  convert:
    if: ${{ github.event.inputs.convert != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/convert-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/ConvertEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # MDB-stem-synth as in the evaluate job: Zenodo's API for the file's md5, then the check.
    - name: Download and check MDB-stem-synth
      run: |
        set -euo pipefail
        rec=1481172; name=MDB-stem-synth.tar.gz; dest="$DATA/mdb.tar.gz"
        for try in 1 2 3 4 5 6 7 8; do
          meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
          md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
          [ -n "$md5" ] && break
          echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
        done
        [ -n "$md5" ] || { echo "no checksum for $name"; exit 1; }
        curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
        echo "$md5  $dest" | md5sum -c -
        mkdir -p "$DATA/mdb"
        tar -xzf "$dest" -C "$DATA/mdb" --exclude='*/._*'
        rm "$dest"

    # The Groove MIDI Dataset's test split and MAESTRO's excerpts, by range requests into the published zips.
    - name: Fetch the drum and piano data
      run: |
        set -euo pipefail
        pip install --quiet remotezip mido
        python3 -I tools/convert/fetch_data.py --gmd "$DATA/gmd" --gmd-per-drummer 2 --maestro "$DATA/maestro" --maestro-count "${{ github.event.inputs.maestro_count || '10' }}"
        du -sh "$DATA"/* | cat

    # Drums on other kits (CD1, docs/specs/pitch.md section 9.9): IDMT-SMT-Drums (Zenodo 7544164, CC BY-NC-ND 4.0, the mixes of the real, techno and wave kits)
    # and MDB Drums (github.com/CarlSouthall/MDBDrums, CC BY-NC-SA 4.0, acoustic kits with toms and cymbals), for measurement on the runner only.
    - name: Download and check IDMT-SMT-Drums
      run: |
        set -euo pipefail
        rec=7544164; name=IDMT-SMT-DRUMS-V2.zip; dest="$DATA/idmt.zip"
        for try in 1 2 3 4 5 6 7 8; do
          meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
          md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
          [ -n "$md5" ] && break
          echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
        done
        [ -n "$md5" ] || { echo "no checksum for $name"; exit 1; }
        curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
        echo "$md5  $dest" | md5sum -c -
        mkdir -p "$DATA/idmt"
        unzip -q "$dest" '*#MIX.wav' '*#MIX.xml' -d "$DATA/idmt"
        rm "$dest"

    - name: Download MDB Drums
      run: |
        set -euo pipefail
        git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/CarlSouthall/MDBDrums.git "$DATA/mdbdrums"
        git -C "$DATA/mdbdrums" sparse-checkout set "MDB Drums/annotations/class" "MDB Drums/audio/full_mix" "MDB Drums/audio/drum_only"
        git -C "$DATA/mdbdrums" rev-parse HEAD
        du -sh "$DATA"/idmt "$DATA"/mdbdrums | cat

    # The upstream package, from its source (Apache-2.0), on the model file the app embeds: the reference the port is checked against.
    - name: Basic Pitch reference
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/spotify/basic-pitch.git "$RUNNER_TEMP/basic-pitch"
        git -C "$RUNNER_TEMP/basic-pitch" rev-parse HEAD
        pip install --quiet numpy scipy librosa resampy pretty_midi mir_eval onnxruntime typing_extensions
        cmp "$RUNNER_TEMP/basic-pitch/basic_pitch/saved_models/icassp_2022/nmp.onnx" 3rdParty/basic-pitch/nmp.onnx
        python3 -I tools/convert/basic_pitch_reference.py --model 3rdParty/basic-pitch/nmp.onnx --upstream "$RUNNER_TEMP/basic-pitch" --out "$DATA/maestro-reference.json" "$DATA"/maestro/*.wav

    - name: Evaluate
      run: |
        set -euo pipefail
        dotnet run -c Release --no-build --project tools/ConvertEval -- --out convert-eval-report.md \
          --mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}" \
          --gmd "$DATA/gmd" --maestro "$DATA/maestro" --reference "$DATA/maestro-reference.json" \
          --ood-idmt "$DATA/idmt" --ood-mdb "$DATA/mdbdrums"

    - name: Job summary
      if: always()
      run: |
        if [ -f convert-eval-report.md ]; then
          head -c 900000 convert-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report (figures, no audio).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: convert-eval-report
        path: convert-eval-report.md
        if-no-files-found: ignore

  am1:
    if: ${{ github.event.inputs.am1 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/am1-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/PitchEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # Zenodo's API for each file's md5, then the check (as the evaluate job does).
    - name: Download and check IDMT-SMT-Drums and MDB-stem-synth
      run: |
        set -euo pipefail
        fetch() {
          local rec="$1" name="$2" dest="$3"
          local meta md5 try
          for try in 1 2 3 4 5 6 7 8; do
            meta=$(curl -sS --retry 5 -L "https://zenodo.org/api/records/$rec" || true)
            md5=$(echo "$meta" | python3 -c "import json,sys; d=json.load(sys.stdin); print([f['checksum'].split(':')[1] for f in d['files'] if f['key']=='$name'][0])" 2>/dev/null || true)
            [ -n "$md5" ] && break
            echo "record $rec: no usable answer (try $try)"; sleep $((try * 10))
          done
          [ -n "$md5" ] || { echo "no checksum for $name"; return 1; }
          echo "$rec $name md5 $md5; licence: $(echo "$meta" | python3 -c "import json,sys; print(json.load(sys.stdin)['metadata']['license'])" 2>/dev/null || echo unknown)"
          curl -sS --retry 8 --retry-delay 5 --retry-all-errors --speed-limit 20000 --speed-time 120 -C - -L -o "$dest" "https://zenodo.org/api/records/$rec/files/$name/content"
          echo "$md5  $dest" | md5sum -c -
        }
        fetch 7544164 IDMT-SMT-DRUMS-V2.zip "$DATA/idmt.zip"
        mkdir -p "$DATA/idmt"
        unzip -q "$DATA/idmt.zip" -x '__MACOSX/*' -d "$DATA/idmt"
        rm "$DATA/idmt.zip"
        fetch 1481172 MDB-stem-synth.tar.gz "$DATA/mdb.tar.gz"
        mkdir -p "$DATA/mdb"
        tar -xzf "$DATA/mdb.tar.gz" -C "$DATA/mdb" --exclude='*/._*'
        rm "$DATA/mdb.tar.gz"
        df -h /mnt | cat

    # GuitarSet's annotations and a spread of the hexaphonic recordings, by range requests.
    - name: Fetch GuitarSet
      run: |
        set -euo pipefail
        pip install --quiet remotezip matplotlib
        python3 -I tools/am1/fetch_guitarset.py "$DATA/gs" --every "${{ github.event.inputs.guitarset_every || '2' }}" --offset 0 --players 03,04,05 --solo
        du -sh "$DATA"/* | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        mkdir -p am1-plots
        dotnet run -c Release --no-build --project tools/PitchEval -- --out am1-eval-report.md \
          --am1-guitarset "$DATA/gs" --gs-mono --gs-players 03,04,05 --am1-idmt "$DATA/idmt" --am1-mdb "$DATA/mdb/MDB-stem-synth" --mdb-limit "${{ github.event.inputs.mdb_limit || '0' }}" \
          --am1-plots am1-plots

    - name: Piano-roll plots
      run: python3 -I tools/am1/plot_rolls.py am1-plots

    - name: Job summary
      if: always()
      run: |
        if [ -f am1-eval-report.md ]; then
          head -c 900000 am1-eval-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Only the report and the plots (figures: note and hit times, no audio).
    - name: Upload the report and the plots
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: am1-eval
        path: |
          am1-eval-report.md
          am1-plots/*.png
          am1-plots/*.json
        if-no-files-found: ignore

  autowarp:
    if: ${{ github.event.inputs.autowarp != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATA: /mnt/autowarp-eval-data
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build the evaluation tool
      run: dotnet build tools/AutoWarpEval -c Release -nologo

    - name: Room for the data
      run: |
        sudo mkdir -p "$DATA"
        sudo chown "$USER" "$DATA"
        df -h / /mnt | cat

    # The Groove MIDI Dataset's recordings (range requests into the zip) and Slakh2100's test split (the tarball read as a stream).
    - name: Fetch the Groove MIDI Dataset
      run: |
        set -euo pipefail
        pip install --quiet numpy mir_eval soundfile pretty_midi remotezip requests
        python3 -I tools/autowarp/fetch_data.py --gmd "$DATA/gmd"
        du -sh "$DATA"/* | cat

    # Slakh2100 is a stream of a very large tarball: if it fails, the report says so (no slakh figures) rather than losing the rest.
    - name: Fetch Slakh2100
      id: slakh
      continue-on-error: true
      run: |
        set -euo pipefail
        python3 -I tools/autowarp/fetch_data.py --slakh "$DATA/slakh"
        du -sh "$DATA"/slakh | cat

    - name: Evaluate
      run: |
        set -euo pipefail
        T="dotnet run -c Release --no-build --project tools/AutoWarpEval --"
        $T --generated --out "$DATA/generated.json"
        $T --dir "$DATA/gmd" --set gmd --out "$DATA/gmd.json"
        extra=""
        if ls "$DATA"/slakh/*.wav > /dev/null 2>&1; then
          $T --dir "$DATA/slakh" --set slakh --out "$DATA/slakh.json"
          extra="$DATA/slakh.json"
        else
          echo "no Slakh2100 data (the fetch step: ${{ steps.slakh.outcome }})"
        fi
        python3 -I tools/autowarp/score.py "$DATA/generated.json" "$DATA/gmd.json" $extra --out autowarp-report.md --csv autowarp-per-file.csv
        $T --pack autowarp-pack --gmd "$DATA/gmd"

    - name: Job summary
      if: always()
      run: |
        if [ -f autowarp-report.md ]; then
          head -c 900000 autowarp-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # The report and the per-file figures (no data).
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: autowarp-report
        path: |
          autowarp-report.md
          autowarp-per-file.csv
        if-no-files-found: ignore

    # The listening pack: renders of two Groove MIDI Dataset performances (CC BY 4.0, Magenta) and the generated lines; a handful of files.
    - name: Upload the listening pack
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: autowarp-pack
        path: autowarp-pack/
        if-no-files-found: ignore

  aw2-tools:
    if: ${{ github.event.inputs.aw2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Build the evaluation and feature tool, and the warp tool
      run: |
        set -euo pipefail
        dotnet build tools/AutoWarpEval -c Release -nologo -v q
        g++ -O2 -std=c++17 -I NeoStretch/third_party tools/aw2/warp.cpp -o aw2warp
        mkdir -p aw2-tools
        cp -r tools/AutoWarpEval/bin/Release/net10.0/. aw2-tools/
        cp aw2warp aw2-tools/aw2warp
    - name: Warp label-mapping self-test
      run: |
        pip install --quiet numpy scipy
        cd tools/aw2 && python3 augment.py --selftest ../../aw2warp | tee ../../warp-selftest.txt
    - name: Forward pass against PyTorch, and timing of a 10-minute file
      run: |
        set -euo pipefail
        pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 export.py --parity ../../parity.bin
        cd ../..
        dotnet aw2-tools/AutoWarpEval.dll --parity parity.bin | tee parity.txt
        cmp parity.bin ReBuzz.SessionTests/AutoWarp/aw2-parity.bin && echo "the committed parity file is what PyTorch writes" || echo "NOTE: the parity file differs (a fresh PyTorch init)"
        for d in 64 96; do
          python3 - "$d" <<'PY'
        import sys, torch
        sys.path.insert(0, "tools/aw2")
        from model import Net
        torch.manual_seed(1)
        n = Net(d=int(sys.argv[1]))
        torch.save({"cfg": n.cfg, "state": n.state_dict()}, f"random{sys.argv[1]}.pt")
        PY
          (cd tools/aw2 && python3 export.py --ckpt ../../random$d.pt --out ../../random$d.aw2m)
          dotnet aw2-tools/AutoWarpEval.dll --bench random$d.aw2m 600 | tee -a timing-random.txt
        done
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools
        path: aw2-tools/
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools-report
        path: |
          warp-selftest.txt
          parity.txt
          timing-random.txt
        retention-days: 7

  aw2-prep:
    needs: aw2-tools
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        set: [gmd, guitarset, candombe, aam, fsl10k]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Restore a finished prep
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f1-${{ matrix.set }}-${{ github.event.inputs.aw2_limit }}-${{ github.event.inputs.aw2_variants }}
    - name: Fetch and prepare
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        extra=""
        if [ "${{ matrix.set }}" = "aam" ]; then extra="--stems 40"; fi
        python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit ${{ github.event.inputs.aw2_limit }} $extra
        mkdir -p ../../prep-out/shards ../../prep-out/eval ../../prep-out/licences
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants ${{ github.event.inputs.aw2_variants }} \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/${{ matrix.set }}-licences.tsv
        if [ -f /mnt/aw2/items/attribution.tsv ]; then cp /mnt/aw2/items/attribution.tsv ../../prep-out/licences/${{ matrix.set }}-attribution.tsv; fi
        du -sh ../../prep-out/* | cat
    - name: Save the prep
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f1-${{ matrix.set }}-${{ github.event.inputs.aw2_limit }}-${{ github.event.inputs.aw2_variants }}
    - uses: actions/upload-artifact@v6
      with:
        name: prep-${{ matrix.set }}
        path: prep-out/
        retention-days: 1

  aw2-slakh:
    if: ${{ github.event.inputs.aw2 == 'true' && github.event.inputs.aw2_slakh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Stream the first 5 GB of Slakh2100 with one forced reconnect
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        start=$(date +%s)
        python3 -u fetch_slakh.py /mnt/aw2/slakh --max-bytes 5000000000 --force-reconnect-at 2000000000 | tee ../../slakh-stream.txt
        echo "seconds: $(( $(date +%s) - start ))" | tee -a ../../slakh-stream.txt
        du -sh /mnt/aw2/slakh/* | tee -a ../../slakh-stream.txt
    - uses: actions/upload-artifact@v6
      with:
        name: slakh-stream-test
        path: slakh-stream.txt
        retention-days: 7

  aw2-train:
    needs: [aw2-tools, aw2-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Train the pilot model
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 -u train.py ../../prep/shards --out ../../pilot.pt --minutes ${{ github.event.inputs.aw2_minutes }} --d ${{ github.event.inputs.aw2_width }} | tee ../../train.log
        python3 export.py --ckpt ../../pilot.pt --out ../../pilot.aw2m --version 1
        ls -la ../../pilot.aw2m
    - name: Score AW1 against the pilot on the held-out items
      run: |
        set -euo pipefail
        T="dotnet aw2-tools/AutoWarpEval.dll"
        mkdir -p results
        python3 - <<'PY'
        import glob, json, os, collections
        by = collections.defaultdict(list)
        for j in glob.glob("prep/eval/*.json"):
            by[json.load(open(j))["dataset"]].append(j)
        for k, v in by.items():
            os.makedirs(f"eval-sets/{k}", exist_ok=True)
            for j in v:
                for ext in (".json", ".wav"):
                    os.symlink(os.path.abspath(j[:-5] + ext), f"eval-sets/{k}/" + os.path.basename(j[:-5]) + ext)
        print({k: len(v) for k, v in by.items()})
        PY
        for s in $(ls eval-sets); do
          $T --dir eval-sets/$s --set $s --model pilot.aw2m --out results/$s.json
        done
        $T --generated --model pilot.aw2m --out results/generated.json
        python3 tools/aw2/score2.py results/*.json --out aw2-pilot-report.md --csv aw2-pilot-per-file.csv
    - name: Time a 10-minute file with the pilot model
      run: |
        dotnet aw2-tools/AutoWarpEval.dll --bench pilot.aw2m 600 | tee timing-pilot.txt
    - name: Job summary
      if: always()
      run: |
        for f in aw2-pilot-report.md timing-pilot.txt train.log; do [ -f $f ] && { echo "## $f"; tail -c 60000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2-pilot-report
        path: |
          aw2-pilot-report.md
          aw2-pilot-per-file.csv
          timing-pilot.txt
          train.log
          prep/licences/
        retention-days: 14
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-pilot-model
        path: pilot.aw2m
        retention-days: 7

  aw2-cleanup:
    needs: [aw2-train]
    if: ${{ always() && github.event.inputs.aw2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
    - name: Delete the intermediate artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate --jq '.artifacts[] | select(.name=="aw2-tools" or (.name|startswith("prep-"))) | .id'); do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id && echo "deleted $id"
        done
