name: Beat model (AW2)

# AW2 (docs/specs/neo-audio.md, AW2 as built): trains the beat and downbeat model of Auto-warp on the runners. By hand only (workflow_dispatch). Training data are CC BY, CC BY 3.0
# or CC0 only, fetched here with the licence of every file checked (tools/aw2/fetch.py, fetch_slakh.py); nothing is committed. The measure-only sets are not touched by this workflow.
#
# AW2a (the pilot): five sets (GMD, GuitarSet, Candombe, AAM subset with stem dropout, FSL10K loops) are fetched and turned into features (the app's own front end, BeatFront.cs, through
# tools/AutoWarpEval --feat) for the audio as it is and for warped (Signalsmith Stretch, tools/aw2/warp.cpp) and transposed variants, labels mapped through the warp; a pilot model is
# trained for `train_minutes`; AW1's DSP and the pilot are scored on the held-out items; the forward pass is checked against PyTorch and timed on a 10-minute file; the Slakh stream is
# tested on its first 5 GB with a forced reconnect. Data pass between jobs as artifacts of one day, deleted at the end (job cleanup); prep results are also kept in the Actions cache
# (keyed by set and feature version, well under 6 GB) so a rerun skips fetching, and every prep step is safe to re-run if the cache was evicted.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Items per training split in each set'
        default: '120'
      variants:
        description: 'Warped variants per training item'
        default: '2'
      train_minutes:
        description: 'Pilot training time, minutes'
        default: '55'
      width:
        description: 'Model width d (64 or 96)'
        default: '64'
      slakh_test:
        description: 'Test the Slakh2100 stream (first 5 GB, forced reconnect)'
        default: 'true'

permissions:
  contents: read
  actions: write

env:
  FEATURE_VERSION: '1'

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Build the evaluation and feature tool, and the warp tool
      run: |
        set -euo pipefail
        dotnet build tools/AutoWarpEval -c Release -nologo -v q
        g++ -O2 -std=c++17 -I NeoStretch/third_party tools/aw2/warp.cpp -o aw2warp
        mkdir -p aw2-tools
        cp -r tools/AutoWarpEval/bin/Release/net10.0/. aw2-tools/
        cp aw2warp aw2-tools/aw2warp
    - name: Warp label-mapping self-test
      run: |
        pip install --quiet numpy scipy
        cd tools/aw2 && python3 augment.py --selftest ../../aw2warp | tee ../../warp-selftest.txt
    - name: Forward pass against PyTorch, and timing of a 10-minute file
      run: |
        set -euo pipefail
        pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 export.py --parity ../../parity.bin
        cd ../..
        dotnet aw2-tools/AutoWarpEval.dll --parity parity.bin | tee parity.txt
        cmp parity.bin ReBuzz.SessionTests/AutoWarp/aw2-parity.bin && echo "the committed parity file is what PyTorch writes" || echo "NOTE: the parity file differs (a fresh PyTorch init)"
        for d in 64 96; do
          python3 - "$d" <<'PY'
        import sys, torch
        sys.path.insert(0, "tools/aw2")
        from model import Net
        torch.manual_seed(1)
        n = Net(d=int(sys.argv[1]))
        torch.save({"cfg": n.cfg, "state": n.state_dict()}, f"random{sys.argv[1]}.pt")
        PY
          (cd tools/aw2 && python3 export.py --ckpt ../../random$d.pt --out ../../random$d.aw2m)
          dotnet aw2-tools/AutoWarpEval.dll --bench random$d.aw2m 600 | tee -a timing-random.txt
        done
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools
        path: aw2-tools/
        retention-days: 1
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-tools-report
        path: |
          warp-selftest.txt
          parity.txt
          timing-random.txt
        retention-days: 7

  prep:
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        set: [gmd, guitarset, candombe, aam, fsl10k]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Restore a finished prep
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f${{ env.FEATURE_VERSION }}-${{ matrix.set }}-${{ inputs.limit }}-${{ inputs.variants }}
    - name: Fetch and prepare
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        chmod +x aw2-tools/aw2warp
        pip install --quiet numpy scipy soundfile remotezip requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        extra=""
        if [ "${{ matrix.set }}" = "aam" ]; then extra="--stems 40"; fi
        python3 fetch.py ${{ matrix.set }} /mnt/aw2/items --limit ${{ inputs.limit }} $extra
        mkdir -p ../../prep-out/shards ../../prep-out/eval ../../prep-out/licences
        python3 prep.py /mnt/aw2/items ../../prep-out/shards --eval-dir ../../prep-out/eval --variants ${{ inputs.variants }} \
          --eval-exe "$GITHUB_WORKSPACE/aw2-tools/AutoWarpEval.dll" --warp "$GITHUB_WORKSPACE/aw2-tools/aw2warp"
        cp /mnt/aw2/items/licences.tsv ../../prep-out/licences/${{ matrix.set }}-licences.tsv
        if [ -f /mnt/aw2/items/attribution.tsv ]; then cp /mnt/aw2/items/attribution.tsv ../../prep-out/licences/${{ matrix.set }}-attribution.tsv; fi
        du -sh ../../prep-out/* | cat
    - name: Save the prep
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          prep-out/shards
          prep-out/eval
          prep-out/licences
        key: aw2-prep-f${{ env.FEATURE_VERSION }}-${{ matrix.set }}-${{ inputs.limit }}-${{ inputs.variants }}
    - uses: actions/upload-artifact@v6
      with:
        name: prep-${{ matrix.set }}
        path: prep-out/
        retention-days: 1

  slakh-stream:
    if: ${{ inputs.slakh_test == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Stream the first 5 GB of Slakh2100 with one forced reconnect
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile requests
        sudo mkdir -p /mnt/aw2 && sudo chown "$USER" /mnt/aw2
        cd tools/aw2
        start=$(date +%s)
        python3 -u fetch_slakh.py /mnt/aw2/slakh --max-bytes 5000000000 --force-reconnect-at 2000000000 | tee ../../slakh-stream.txt
        echo "seconds: $(( $(date +%s) - start ))" | tee -a ../../slakh-stream.txt
        du -sh /mnt/aw2/slakh/* | tee -a ../../slakh-stream.txt
    - uses: actions/upload-artifact@v6
      with:
        name: slakh-stream-test
        path: slakh-stream.txt
        retention-days: 7

  train:
    needs: [tools, prep]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v7
      with:
        pattern: prep-*
        path: prep
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        name: aw2-tools
        path: aw2-tools
    - name: Train the pilot model
      run: |
        set -euo pipefail
        pip install --quiet numpy scipy soundfile mir_eval requests
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        cd tools/aw2
        python3 -u train.py ../../prep/shards --out ../../pilot.pt --minutes ${{ inputs.train_minutes }} --d ${{ inputs.width }} | tee ../../train.log
        python3 export.py --ckpt ../../pilot.pt --out ../../pilot.aw2m --version 1
        ls -la ../../pilot.aw2m
    - name: Score AW1 against the pilot on the held-out items
      run: |
        set -euo pipefail
        T="dotnet aw2-tools/AutoWarpEval.dll"
        mkdir -p results
        python3 - <<'PY'
        import glob, json, os, collections
        by = collections.defaultdict(list)
        for j in glob.glob("prep/eval/*.json"):
            by[json.load(open(j))["dataset"]].append(j)
        for k, v in by.items():
            os.makedirs(f"eval-sets/{k}", exist_ok=True)
            for j in v:
                for ext in (".json", ".wav"):
                    os.symlink(os.path.abspath(j[:-5] + ext), f"eval-sets/{k}/" + os.path.basename(j[:-5]) + ext)
        print({k: len(v) for k, v in by.items()})
        PY
        for s in $(ls eval-sets); do
          $T --dir eval-sets/$s --set $s --model pilot.aw2m --out results/$s.json
        done
        $T --generated --model pilot.aw2m --out results/generated.json
        python3 tools/aw2/score2.py results/*.json --out aw2-pilot-report.md --csv aw2-pilot-per-file.csv
    - name: Time a 10-minute file with the pilot model
      run: |
        dotnet aw2-tools/AutoWarpEval.dll --bench pilot.aw2m 600 | tee timing-pilot.txt
    - name: Job summary
      if: always()
      run: |
        for f in aw2-pilot-report.md timing-pilot.txt train.log; do [ -f $f ] && { echo "## $f"; tail -c 60000 $f; } >> "$GITHUB_STEP_SUMMARY"; done || true
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: aw2-pilot-report
        path: |
          aw2-pilot-report.md
          aw2-pilot-per-file.csv
          timing-pilot.txt
          train.log
          prep/licences/
        retention-days: 14
    - uses: actions/upload-artifact@v6
      with:
        name: aw2-pilot-model
        path: pilot.aw2m
        retention-days: 7

  cleanup:
    needs: [train]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Delete the intermediate artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate --jq '.artifacts[] | select(.name=="aw2-tools" or (.name|startswith("prep-"))) | .id'); do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id && echo "deleted $id"
        done
