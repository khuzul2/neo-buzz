name: Fork Mac

# The portable parts on Apple silicon (docs/specs/mac-engine.md M4), ahead of the Mac engine
# itself: the Session View core, the agent server's core and the Neo machines' DSP measurements
# run on macos-15 (arm64), and the PortAudio binding runs a stream through CoreAudio. Catches
# arm64 numerical drift in the machines early (mac-engine.md §5). M6: the CoreMIDI binding loops
# back through virtual ports, and the Link helper builds with CMake and runs.
#
# macOS minutes cost about 10× Linux on a private repo: PRs into main that touch portable code,
# and by hand. Never on every push.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Machines/**'
      - 'ReBuzz/**'
      - 'ReBuzz.Engine/**'
      - 'ReBuzz.Headless/**'
      - 'ReBuzz.Host/**'
      - 'ReBuzz.Studio/**'
      - 'ReBuzz.Studio.Tests/**'
      - 'tools/mac-bundle.sh'
      - 'tools/mac-dmg.sh'
      - 'tools/mac-dmg/**'
      - 'ReBuzzGUI/BuzzGUI.Common/**'
      - 'ReBuzzGUI/BuzzGUI.Interfaces/**'
      - 'tools/headless-smoke.py'
      - 'tools/headless-pedal.py'
      - 'ExternalMachines/portable/**'
      - 'ExternalMachines/source/thepedal/**'
      - 'tools/headless-live.py'
      - 'tools/song-roundtrip.py'
      - 'tools/clip-null.py'
      - 'tools/null-test.py'
      - 'tools/headless-midi.py'
      - 'LinkHelper/**'
      - 'NeoStretch/**'
      - 'ReBuzz.AgentEval/**'
      - 'eval/**'
      - 'ReBuzz/Core/Session/**'
      - 'ReBuzz.Agent/**'
      - 'ReBuzz.SessionTests/**'
      - 'ReBuzz.AgentTests/**'
      - 'NeoBuzz.MachineTests/**'
      - 'ReBuzzEngine/portable/**'
      - 'ReBuzzEngine/rebe/**'
      - 'ExternalMachines/machines.json'
      - 'ExternalMachines/source/**'
      - 'tools/build-natives-posix.py'
      - 'tools/native-cross.py'
      - 'tools/native-compare.py'
      - '.github/workflows/fork-mac.yml'
  workflow_dispatch:
    inputs:
      gallery:
        description: 'Instead of the tests: draw the UI gallery on a Mac (docs/specs/ui-gallery.md), pushed to ci-artifacts-mac'
        type: boolean
        default: false

# Clips CU3 (clips.md 5.7): the tools that build songs with the agent write notes into classic machines, which are view only for a person.
env:
  NEOBUZZ_CLIP_EDIT_ALL: '1'

jobs:
  portable-tests:
    if: ${{ inputs.gallery != true }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # PortAudio from Homebrew (/opt/homebrew/lib, which the engine's resolver searches). The
    # runner has no sound card, but CoreAudio offers "Apple Virtual Sound Device" and a "Null
    # Audio Device", so a stream opens and runs in real time.
    - name: PortAudio
      run: brew install portaudio

    # The Ableton Link helper (mac-engine.md M6), built with CMake as ReBuzzLink. The seam tests
    # run it; rebuzz-headless's build copies it beside the app, where LinkClient looks.
    - name: Link helper (CMake)
      run: |
        git submodule update --init --recursive --depth 1 LinkHelper/link
        cmake -S LinkHelper -B build/LinkHelper
        cmake --build build/LinkHelper -j 3
        file build/LinkHelper/ReBuzzLink

    # Neo Audio's Pro warp mode (docs/specs/neo-audio.md section 11): the neostretch library, a C ABI over Signalsmith Stretch, built
    # with CMake and tested by its own test (no allocation in the audio calls, finite output, alignment); the session tests copy it
    # beside themselves, so the Pro tests run against it.
    - name: NeoStretch (CMake)
      run: |
        cmake -S NeoStretch -B build/NeoStretch "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
        cmake --build build/NeoStretch -j 3
        ctest --test-dir build/NeoStretch --output-on-failure
        # universal: Intel Macs play Pro too (docs/specs/neo-audio.md section 11)
        lipo -info build/NeoStretch/libneostretch.dylib | tee /dev/stderr | grep -q "x86_64" && lipo -info build/NeoStretch/libneostretch.dylib | grep -q "arm64"

    # With the CoreMIDI loopback (virtual ports; the runner has no MIDI devices) and the Link helper.
    - name: Session View core and platform seams
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      env:
        REBUZZ_LINK_HELPER: ${{ github.workspace }}/build/LinkHelper/ReBuzzLink
      run: dotnet test ReBuzz.SessionTests --logger "console;verbosity=normal" 2>&1 | tee test.log

    - name: Agent server core
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      if: always()
      run: dotnet test ReBuzz.AgentTests --logger "console;verbosity=normal" 2>&1 | tee agent-test.log

    - name: Machine DSP tests (arm64)
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      if: always()
      env:
        MEASUREMENTS_DIR: ${{ github.workspace }}/measurements
      run: dotnet test NeoBuzz.MachineTests --logger "console;verbosity=normal" 2>&1 | tee machine-test.log

    # The classic Buzz machines rebuilt natively (docs/specs/cross-platform.md R1) and the portable host that runs them
    # out of process: ReBuzz.Host/AppGear.targets copies build/natives (Gear, Licenses) and build/native-host into
    # rebuzz-headless's output when it is built.
    # always(): a failed test step above must not skip the build and make the classic-machine step fail for a missing host.
    - name: Classic machines and native host (C++)
      if: always()
      run: |
        python3 tools/build-natives-posix.py --out build/natives
        cmake -S ReBuzzEngine/portable -B build/native-host >/dev/null
        cmake --build build/native-host -j 3
        ls build/natives/Gear/*

    # rebuzz-headless on Apple silicon (docs/specs/mac-engine.md M1/M4): the engine and the Neo
    # machines built for osx-arm64, driven over MCP stdio by the same smoke test as Linux.
    - name: Headless engine on macOS
      if: always()
      run: |
        brew install libsndfile || true
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q
        python3 tools/headless-smoke.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/smoke"

    # The clip goldens (docs/specs/clips.md §10.1, CU1) on Apple silicon: placeholders for the classic machines, against the goldens of macos-arm64.
    - name: Clip goldens on macOS
      if: always()
      run: |
        python3 tools/clip-null.py --audio "$RUNNER_TEMP/clip-audio" check ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/clip" --twice
        python3 tools/clip-null.py opentime ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/clip-open"

    - name: Upload the clip goldens observed
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: clip-goldens-macos
        path: |
          ${{ runner.temp }}/clip/observed.json
          ${{ runner.temp }}/clip-open/open-times.json
        if-no-files-found: ignore

    # CU3: the renders themselves, for tools/clip-change-report.py (clip-change-report.yml). Never committed.
    - name: Upload the clip renders (audio)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: clip-audio-macos
        path: ${{ runner.temp }}/clip-audio/*.wav
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

    # R1: each rebuilt classic loads and renders its cases through the native host (finite, audible, no divergence), and the
    # classic demo songs of ExternalMachines/source open with their machines and play (tools/native-cross.py).
    - name: Classic machines on macOS
      if: always()
      run: |
        bash tools/ci-pip.sh numpy
        test -x ReBuzz.Headless/bin/Release/net10.0/rebuzz-native-host
        python3 tools/native-cross.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/natives" --json "$RUNNER_TEMP/natives.json"

    # The Pedal machines (docs/specs/studio-mvp.md S2) on Apple silicon, as on Linux.
    - name: Pedal machines on macOS
      if: always()
      run: python3 tools/headless-pedal.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/pedal"

    # The A6 scripted suite (docs/specs/mcp-server.md §10) on Apple silicon: mac-engine.md M4's
    # first exit check. Same checks, tasks and baseline as Windows and Linux.
    - name: Agent evaluation on macOS (rebuzz-headless)
      if: always()
      run: |
        dotnet build ReBuzz.AgentEval/ReBuzz.AgentEval.csproj -c Release -nologo -v:q
        dotnet ReBuzz.AgentEval/bin/Release/net10.0/ReBuzz.AgentEval.dll run --exe ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless --out "$RUNNER_TEMP/eval" --baseline eval/baseline.json

    # Live audio through CoreAudio (mac-engine.md M5): rebuzz-headless --audio on the runner's
    # virtual sound device, in real time; the live tools play and meter it. With four synths at
    # once, the render workers must be in the device's audio workgroup (M7).
    - name: Live audio on macOS (CoreAudio)
      if: always()
      run: python3 tools/headless-live.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/live" --expect-workgroup

    # MIDI and Link (mac-engine.md M6), as another app on the Mac sees them: a keyboard plugged in
    # while it plays, notes into its virtual destination "NeoBuzz Live", clock out from its virtual source,
    # and the Link helper running beside it.
    - name: MIDI and Link on macOS (CoreMIDI)
      if: always()
      run: python3 tools/headless-midi.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/midi"

    # The studio (docs/specs/studio-mvp.md): its headless view tests on arm64, then NeoBuzz Live.app
    # (self-contained, ad-hoc signed; tools/mac-bundle.sh checks its Info.plist names, executable and
    # signature) built, packed into the disk image people install from (tools/mac-dmg.sh: it mounts
    # as "NeoBuzz Live", the app in it is named NeoBuzz Live and verifies, the read-me says how to
    # install and open it), and installed out of it; the installed copy is started for real: it opens
    # its window, starts the engine with the runner's audio device, and quits (--smoke). The disk
    # image is uploaded with the run; mac-release.yml publishes it when the change reaches main.
    - name: Studio (Avalonia, headless) on arm64
      if: always()
      shell: bash
      env:
        SCREENSHOTS_DIR: ${{ github.workspace }}/studio-screenshots
      run: dotnet test ReBuzz.Studio.Tests --logger "console;verbosity=normal" 2>&1 | tee studio-test.log

    - name: NeoBuzz Live.app (osx-arm64)
      if: always()
      shell: bash
      run: |
        brew install dylibbundler libsndfile >/dev/null || true
        tools/mac-bundle.sh "$RUNNER_TEMP/app"
        tools/mac-dmg.sh "$RUNNER_TEMP/app/NeoBuzz Live.app" "$RUNNER_TEMP/app/NeoBuzz-Live-macos-arm64.dmg" "$RUNNER_TEMP/installed"
        # The installed app's runtime settings: methods with loops compiled fully optimised at once (daw-modes.md §8.1).
        grep -Eq '"System.Runtime.TieredCompilation.QuickJitForLoops": *false' "$RUNNER_TEMP/installed/NeoBuzz Live.app/Contents/MacOS/ReBuzz.Studio.runtimeconfig.json" || { echo "::error::the app's runtimeconfig.json doesn't turn quick JIT for loops off"; exit 1; }
        python3 -c "import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=180).returncode)" \
          "$RUNNER_TEMP/installed/NeoBuzz Live.app/Contents/MacOS/NeoBuzz Live" --smoke --settings "$RUNNER_TEMP/studio-settings" 2>&1 | tee studio-smoke.log
        grep -q "smoke: ok" studio-smoke.log
        grep -q "^\[NeoBuzz Live\] " studio-smoke.log

    - name: Upload the disk image
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: NeoBuzz-Live-macos-arm64-dmg
        path: ${{ runner.temp }}/app/NeoBuzz-Live-macos-arm64.dmg
        compression-level: 0
        if-no-files-found: ignore

    # P3's exit (docs/specs/studio-mvp.md S9): NeoBuzz Live.app itself, with the runner's audio device and
    # agents allowed on a free port for this run (--agent-port, --agent-token: nothing saved), and
    # the A7 live scenarios against it over Streamable HTTP, as Claude Code connects: transport,
    # session launch and record, midi_play, meters_read, a render. Then the system asks it to quit.
    - name: The studio's MCP server, live (NeoBuzz Live.app)
      if: always()
      run: python3 tools/headless-live.py --studio "$RUNNER_TEMP/installed/NeoBuzz Live.app/Contents/MacOS/NeoBuzz Live" "$RUNNER_TEMP/studio-live" --expect-workgroup

    - name: Summary
      if: always()
      run: |
        for f in test.log agent-test.log machine-test.log studio-test.log; do
          [ -f "$f" ] || continue
          total=$(grep -E "^\s*Total tests:" "$f" | tail -1 | sed 's/[^0-9]//g')
          passed=$(grep -E "^\s*Passed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          failed=$(grep -E "^\s*Failed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          echo "::notice title=$f::total ${total:-?}, passed ${passed:-?}, failed ${failed:-0}"
          grep -E "^\s+Failed " "$f" | head -20 | while read -r line; do echo "::error title=$f::$line"; done
        done

  # Plug-in host (docs/specs/plugin-host.md, H1): neoplug built with CMake, Surge XT (CLAP and VST3), the SDK's AGain and Note
  # Expression Synth and our test plug-ins hosted by Neo Plug / Neo Plug FX in rebuzz-headless: load, play, save, reload.
  plugin-host:
    if: ${{ inputs.gallery != true }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Plug-in host (native build, Surge XT, round trip)
      run: tools/ci-plugin-host.sh

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: plugin-host-macos
        path: plugin-host-results
        if-no-files-found: ignore

  # The UI gallery on a Mac (docs/specs/ui-gallery.md), by hand only (gallery: true): the headless gallery drawn with
  # macOS's fonts, and the real NeoBuzz Live.app on the runner's screen (screencapture: its window and the menu bar), to
  # check the headless pictures against. Pushed as one commit to the ci-artifacts-mac branch, overwritten each time.
  gallery:
    if: ${{ inputs.gallery == true }}
    runs-on: macos-15
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Libraries
      run: brew install portaudio libsndfile dylibbundler >/dev/null || true

    - name: Headless gallery (macOS fonts)
      shell: bash
      env:
        GALLERY_DIR: ${{ github.workspace }}/gallery/headless
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        # DD1 gave three ordinary tests the Gallery category; with them in the filter NUnit leaves the Explicit GalleryTests out, so each is run by its own filter.
        dotnet test ReBuzz.Studio.Tests -c Release --filter "FullyQualifiedName~ReBuzz.Studio.Tests.GalleryTests" --logger "console;verbosity=normal" 2>&1 | grep -E "gallery\]|Passed |Failed |Total tests|error" || true
        dotnet test ReBuzz.Studio.Tests -c Release --filter TestCategory=Gallery --logger "console;verbosity=normal" 2>&1 | grep -E "gallery\]|Passed |Failed |Total tests|error" || true

    # Fork (ux-overhaul.md P4b): the same gallery in the Light theme, beside the dark one (GALLERY_THEME=light).
    - name: Headless gallery, Light theme (macOS fonts)
      if: always()
      shell: bash
      env:
        GALLERY_DIR: ${{ github.workspace }}/gallery/headless-light
        GALLERY_THEME: light
      run: |
        # DD1 gave three ordinary tests the Gallery category; with them in the filter NUnit leaves the Explicit GalleryTests out, so each is run by its own filter.
        dotnet test ReBuzz.Studio.Tests -c Release --filter "FullyQualifiedName~ReBuzz.Studio.Tests.GalleryTests" --logger "console;verbosity=normal" 2>&1 | grep -E "gallery\]|Passed |Failed |Total tests|error" || true
        dotnet test ReBuzz.Studio.Tests -c Release --filter TestCategory=Gallery --logger "console;verbosity=normal" 2>&1 | grep -E "gallery\]|Passed |Failed |Total tests|error" || true

    # P3g polish: the Machine View's frame time on the big song (49 machines, 46 wires), meters off and on, alternated twice, and the Window's
    # views: UxFrameTimeTests (explicit, category UxMeasure). The figures are the lines "[ux-measure]" of this step's log.
    - name: Frame times, meters on and off
      if: always()
      shell: bash
      run: |
        dotnet test ReBuzz.Studio.Tests -c Release --filter TestCategory=UxMeasure --logger "console;verbosity=detailed" 2>&1 | grep -E "ux-measure|Passed |Failed |Total tests|error" || true

    - name: The real app on the runner's screen
      if: always()
      shell: bash
      run: |
        tools/mac-bundle.sh "$RUNNER_TEMP/app"
        tools/ui-gallery-mac.sh "$RUNNER_TEMP/app/NeoBuzz Live.app" "gallery/headless/Night Drive.bmxml" gallery/real

    - name: Publish to ci-artifacts-mac
      if: always() && hashFiles('gallery/**/*.png') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        dir="$RUNNER_TEMP/ci-artifacts-mac"
        mkdir -p "$dir"
        cp -R gallery/. "$dir/"
        echo "Mac UI gallery from run $GITHUB_RUN_ID of $GITHUB_REF_NAME at $GITHUB_SHA." > "$dir/README.md"
        cd "$dir"
        git init -q -b ci-artifacts-mac
        git add -A
        git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' commit -q -m "Mac UI gallery: run $GITHUB_RUN_ID ($GITHUB_REF_NAME $GITHUB_SHA)"
        git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ci-artifacts-mac
        echo "::notice title=Mac UI gallery::$(find . -name '*.png' | wc -l) pictures pushed to ci-artifacts-mac"
