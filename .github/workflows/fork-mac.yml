name: Fork Mac

# The portable parts on Apple silicon (docs/specs/mac-engine.md M4), ahead of the Mac engine
# itself: the Session View core, the agent server's core and the Neo machines' DSP measurements
# run on macos-15 (arm64), and the PortAudio binding runs a stream through CoreAudio. Catches
# arm64 numerical drift in the machines early (mac-engine.md §5). M6: the CoreMIDI binding loops
# back through virtual ports, and the Link helper builds with CMake and runs.
#
# macOS minutes cost about 10× Linux on a private repo: PRs into main that touch portable code,
# and by hand. Never on every push.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Machines/**'
      - 'ReBuzz/**'
      - 'ReBuzz.Engine/**'
      - 'ReBuzz.Headless/**'
      - 'ReBuzz.Host/**'
      - 'ReBuzz.Studio/**'
      - 'ReBuzz.Studio.Tests/**'
      - 'tools/mac-bundle.sh'
      - 'tools/mac-dmg.sh'
      - 'tools/mac-dmg/**'
      - 'ReBuzzGUI/BuzzGUI.Common/**'
      - 'ReBuzzGUI/BuzzGUI.Interfaces/**'
      - 'tools/headless-smoke.py'
      - 'tools/headless-pedal.py'
      - 'ExternalMachines/portable/**'
      - 'ExternalMachines/source/thepedal/**'
      - 'tools/headless-live.py'
      - 'tools/song-roundtrip.py'
      - 'tools/headless-midi.py'
      - 'LinkHelper/**'
      - 'ReBuzz.AgentEval/**'
      - 'eval/**'
      - 'ReBuzz/Core/Session/**'
      - 'ReBuzz.Agent/**'
      - 'ReBuzz.SessionTests/**'
      - 'ReBuzz.AgentTests/**'
      - 'NeoBuzz.MachineTests/**'
      - '.github/workflows/fork-mac.yml'
  workflow_dispatch:

jobs:
  portable-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # PortAudio from Homebrew (/opt/homebrew/lib, which the engine's resolver searches). The
    # runner has no sound card, but CoreAudio offers "Apple Virtual Sound Device" and a "Null
    # Audio Device", so a stream opens and runs in real time.
    - name: PortAudio
      run: brew install portaudio

    # The Ableton Link helper (mac-engine.md M6), built with CMake as ReBuzzLink. The seam tests
    # run it; rebuzz-headless's build copies it beside the app, where LinkClient looks.
    - name: Link helper (CMake)
      run: |
        git submodule update --init --recursive --depth 1 LinkHelper/link
        cmake -S LinkHelper -B build/LinkHelper
        cmake --build build/LinkHelper -j 3
        file build/LinkHelper/ReBuzzLink

    # With the CoreMIDI loopback (virtual ports; the runner has no MIDI devices) and the Link helper.
    - name: Session View core and platform seams
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      env:
        REBUZZ_LINK_HELPER: ${{ github.workspace }}/build/LinkHelper/ReBuzzLink
      run: dotnet test ReBuzz.SessionTests --logger "console;verbosity=normal" 2>&1 | tee test.log

    - name: Agent server core
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      if: always()
      run: dotnet test ReBuzz.AgentTests --logger "console;verbosity=normal" 2>&1 | tee agent-test.log

    - name: Machine DSP tests (arm64)
      shell: bash   # -eo pipefail: a failing dotnet test fails the step, through tee
      if: always()
      env:
        MEASUREMENTS_DIR: ${{ github.workspace }}/measurements
      run: dotnet test NeoBuzz.MachineTests --logger "console;verbosity=normal" 2>&1 | tee machine-test.log

    # rebuzz-headless on Apple silicon (docs/specs/mac-engine.md M1/M4): the engine and the Neo
    # machines built for osx-arm64, driven over MCP stdio by the same smoke test as Linux.
    - name: Headless engine on macOS
      if: always()
      run: |
        brew install libsndfile || true
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q
        python3 tools/headless-smoke.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/smoke"

    # The Pedal machines (docs/specs/studio-mvp.md S2) on Apple silicon, as on Linux.
    - name: Pedal machines on macOS
      if: always()
      run: python3 tools/headless-pedal.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/pedal"

    # The A6 scripted suite (docs/specs/mcp-server.md §10) on Apple silicon: mac-engine.md M4's
    # first exit check. Same checks, tasks and baseline as Windows and Linux.
    - name: Agent evaluation on macOS (rebuzz-headless)
      if: always()
      run: |
        dotnet build ReBuzz.AgentEval/ReBuzz.AgentEval.csproj -c Release -nologo -v:q
        dotnet ReBuzz.AgentEval/bin/Release/net10.0/ReBuzz.AgentEval.dll run --exe ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless --out "$RUNNER_TEMP/eval" --baseline eval/baseline.json

    # Live audio through CoreAudio (mac-engine.md M5): rebuzz-headless --audio on the runner's
    # virtual sound device, in real time; the live tools play and meter it. With four synths at
    # once, the render workers must be in the device's audio workgroup (M7).
    - name: Live audio on macOS (CoreAudio)
      if: always()
      run: python3 tools/headless-live.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/live" --expect-workgroup

    # MIDI and Link (mac-engine.md M6), as another app on the Mac sees them: a keyboard plugged in
    # while it plays, notes into ReBuzz's virtual destination, clock out from its virtual source,
    # and the Link helper running beside it.
    - name: MIDI and Link on macOS (CoreMIDI)
      if: always()
      run: python3 tools/headless-midi.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/midi"

    # The studio (docs/specs/studio-mvp.md): its headless view tests on arm64, then ReBuzz.app
    # (self-contained, ad-hoc signed) built, packed into the disk image people install from
    # (tools/mac-dmg.sh), and installed out of it; the installed copy is started for real: it opens
    # its window, starts the engine with the runner's audio device, and quits (--smoke). The disk
    # image is uploaded with the run; mac-release.yml publishes it when the change reaches main.
    - name: Studio (Avalonia, headless) on arm64
      if: always()
      shell: bash
      env:
        SCREENSHOTS_DIR: ${{ github.workspace }}/studio-screenshots
      run: dotnet test ReBuzz.Studio.Tests --logger "console;verbosity=normal" 2>&1 | tee studio-test.log

    - name: ReBuzz.app (osx-arm64)
      if: always()
      shell: bash
      run: |
        brew install dylibbundler libsndfile >/dev/null || true
        tools/mac-bundle.sh "$RUNNER_TEMP/app"
        tools/mac-dmg.sh "$RUNNER_TEMP/app/ReBuzz.app" "$RUNNER_TEMP/app/ReBuzz-macos-arm64.dmg" "$RUNNER_TEMP/installed"
        python3 -c "import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=180).returncode)" \
          "$RUNNER_TEMP/installed/ReBuzz.app/Contents/MacOS/ReBuzz.Studio" --smoke --settings "$RUNNER_TEMP/studio-settings" 2>&1 | tee studio-smoke.log
        grep -q "smoke: ok" studio-smoke.log

    - name: Upload the disk image
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ReBuzz-macos-arm64-dmg
        path: ${{ runner.temp }}/app/ReBuzz-macos-arm64.dmg
        compression-level: 0
        if-no-files-found: ignore

    # P3's exit (docs/specs/studio-mvp.md S9): ReBuzz.app itself, with the runner's audio device and
    # agents allowed on a free port for this run (--agent-port, --agent-token: nothing saved), and
    # the A7 live scenarios against it over Streamable HTTP, as Claude Code connects: transport,
    # session launch and record, midi_play, meters_read, a render. Then the system asks it to quit.
    - name: The studio's MCP server, live (ReBuzz.app)
      if: always()
      run: python3 tools/headless-live.py --studio "$RUNNER_TEMP/installed/ReBuzz.app/Contents/MacOS/ReBuzz.Studio" "$RUNNER_TEMP/studio-live" --expect-workgroup

    - name: Summary
      if: always()
      run: |
        for f in test.log agent-test.log machine-test.log studio-test.log; do
          [ -f "$f" ] || continue
          total=$(grep -E "^\s*Total tests:" "$f" | tail -1 | sed 's/[^0-9]//g')
          passed=$(grep -E "^\s*Passed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          failed=$(grep -E "^\s*Failed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          echo "::notice title=$f::total ${total:-?}, passed ${passed:-?}, failed ${failed:-0}"
          grep -E "^\s+Failed " "$f" | head -20 | while read -r line; do echo "::error title=$f::$line"; done
        done

  # TEMPORARY (agent/ci-flakes measurement, reverted before the final runs): Neo Delay's one-off allocation on this
  # runner, hunted with the per-block AllocationCheck: the fixtures that ran before it when it failed, 25 times.
  allocation-soak:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Soak
      shell: bash
      run: |
        dotnet build NeoBuzz.MachineTests -nologo -v:q
        fails=0
        for k in $(seq 1 25); do
          dotnet test NeoBuzz.MachineTests --no-build --filter "FullyQualifiedName~AnalyzerTests|FullyQualifiedName~CompTests|FullyQualifiedName~DelayTests|FullyQualifiedName~MeasureTests" --logger "console;verbosity=normal" > soak$k.log 2>&1 || fails=$((fails+1))
          grep -E "^Neo Delay: [0-9]+ bytes|^Neo Analyzer: allocation" soak$k.log | sed "s/^/[$k] /"
          grep -E "^\s+Failed " -A60 soak$k.log | head -90 | sed "s/^/[$k] /"
        done
        grep -h -A12 "^4[0-9]* bytes in 300 blocks" soak1.log | head -14
        echo "soak: $fails of 25 runs failed"
