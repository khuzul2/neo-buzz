name: Fork Mac

# The portable parts on Apple silicon (docs/specs/mac-engine.md M4), ahead of the Mac engine
# itself: the Session View core, the agent server's core and the Neo machines' DSP measurements
# run on macos-15 (arm64), and the PortAudio binding runs a stream through CoreAudio. Catches
# arm64 numerical drift in the machines early (mac-engine.md §5). M6: the CoreMIDI binding loops
# back through virtual ports, and the Link helper builds with CMake and runs.
#
# macOS minutes cost about 10× Linux on a private repo: PRs into main that touch portable code,
# and by hand. Never on every push.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Machines/**'
      - 'ReBuzz/**'
      - 'ReBuzz.Engine/**'
      - 'ReBuzz.Headless/**'
      - 'ReBuzzGUI/BuzzGUI.Common/**'
      - 'ReBuzzGUI/BuzzGUI.Interfaces/**'
      - 'tools/headless-smoke.py'
      - 'tools/headless-live.py'
      - 'tools/headless-midi.py'
      - 'LinkHelper/**'
      - 'ReBuzz.AgentEval/**'
      - 'eval/**'
      - 'ReBuzz/Core/Session/**'
      - 'ReBuzz.Agent/**'
      - 'ReBuzz.SessionTests/**'
      - 'ReBuzz.AgentTests/**'
      - 'NeoBuzz.MachineTests/**'
      - '.github/workflows/fork-mac.yml'
  workflow_dispatch:

jobs:
  portable-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # PortAudio from Homebrew (/opt/homebrew/lib, which the engine's resolver searches). The
    # runner has no sound card, but CoreAudio offers "Apple Virtual Sound Device" and a "Null
    # Audio Device", so a stream opens and runs in real time.
    - name: PortAudio
      run: brew install portaudio

    # The Ableton Link helper (mac-engine.md M6), built with CMake as ReBuzzLink. The seam tests
    # run it; rebuzz-headless's build copies it beside the app, where LinkClient looks.
    - name: Link helper (CMake)
      run: |
        git submodule update --init --recursive --depth 1 LinkHelper/link
        cmake -S LinkHelper -B build/LinkHelper
        cmake --build build/LinkHelper -j 3
        file build/LinkHelper/ReBuzzLink

    # With the CoreMIDI loopback (virtual ports; the runner has no MIDI devices) and the Link helper.
    - name: Session View core and platform seams
      env:
        REBUZZ_LINK_HELPER: ${{ github.workspace }}/build/LinkHelper/ReBuzzLink
      run: dotnet test ReBuzz.SessionTests --logger "console;verbosity=normal" 2>&1 | tee test.log

    - name: Agent server core
      if: always()
      run: dotnet test ReBuzz.AgentTests --logger "console;verbosity=normal" 2>&1 | tee agent-test.log

    - name: Machine DSP tests (arm64)
      if: always()
      env:
        MEASUREMENTS_DIR: ${{ github.workspace }}/measurements
      run: dotnet test NeoBuzz.MachineTests --logger "console;verbosity=normal" 2>&1 | tee machine-test.log

    # rebuzz-headless on Apple silicon (docs/specs/mac-engine.md M1/M4): the engine and the Neo
    # machines built for osx-arm64, driven over MCP stdio by the same smoke test as Linux.
    - name: Headless engine on macOS
      if: always()
      run: |
        brew install libsndfile || true
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q
        python3 tools/headless-smoke.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/smoke"

    # The A6 scripted suite (docs/specs/mcp-server.md §10) on Apple silicon: mac-engine.md M4's
    # first exit check. Same checks, tasks and baseline as Windows and Linux.
    - name: Agent evaluation on macOS (rebuzz-headless)
      if: always()
      run: |
        dotnet build ReBuzz.AgentEval/ReBuzz.AgentEval.csproj -c Release -nologo -v:q
        dotnet ReBuzz.AgentEval/bin/Release/net10.0/ReBuzz.AgentEval.dll run --exe ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless --out "$RUNNER_TEMP/eval" --baseline eval/baseline.json

    # Live audio through CoreAudio (mac-engine.md M5): rebuzz-headless --audio on the runner's
    # virtual sound device, in real time; the live tools play and meter it.
    - name: Live audio on macOS (CoreAudio)
      if: always()
      run: python3 tools/headless-live.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/live"

    # MIDI and Link (mac-engine.md M6), as another app on the Mac sees them: a keyboard plugged in
    # while it plays, notes into ReBuzz's virtual destination, clock out from its virtual source,
    # and the Link helper running beside it.
    - name: MIDI and Link on macOS (CoreMIDI)
      if: always()
      run: python3 tools/headless-midi.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/midi"

    - name: Summary
      if: always()
      run: |
        for f in test.log agent-test.log machine-test.log; do
          [ -f "$f" ] || continue
          total=$(grep -E "^\s*Total tests:" "$f" | tail -1 | sed 's/[^0-9]//g')
          passed=$(grep -E "^\s*Passed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          failed=$(grep -E "^\s*Failed:" "$f" | tail -1 | sed 's/[^0-9]//g')
          echo "::notice title=$f::total ${total:-?}, passed ${passed:-?}, failed ${failed:-0}"
          grep -E "^\s+Failed " "$f" | head -20 | while read -r line; do echo "::error title=$f::$line"; done
        done
