name: ReBuzz CI Build

# Fork: manual only. Fork CI (fork-ci.yml) builds ReBuzz on pushes to main and on PRs,
# so running this too would spend the same Actions minutes twice.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    # Fork: the projects put output and restore files under $(SolutionDir), which is only
    # defined when building the .sln; ReBuzzCleanBuild skips a step that breaks clean builds.
    - name: Build ReBuzz
      run: dotnet build ReBuzz/ReBuzz.csproj -c Release "-p:SolutionDir=${{ github.workspace }}\" -p:ReBuzzCleanBuild=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rebuzz-release-build
        path: bin/Release/
