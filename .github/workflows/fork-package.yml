name: Fork package (ReBuzz + all machines)

# Builds the whole solution plus ExternalMachines with build.ps1, uploads the zip and runs
# upstream's test suite (ReBuzzTests). Run it by hand from the Actions tab, or push a tag
# like fork-v0.1.0 to also attach the zip to a GitHub release.
#
# It also renders the null test's references (Neo machines, tools/null-test.py) with ReBuzz.exe;
# two jobs then render the same cases with rebuzz-headless on Linux and macOS and compare
# (docs/specs/mac-engine.md M3/M4).
#
# Manual inputs for test work: "quick" skips the external machines and the zip,
# "test_filter" runs a subset of tests (dotnet test --filter syntax), and "profile_only"
# profiles some machines (tools/machine-profiler.py --only) instead of every one.

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick: build the solution and run tests only (no external machines, no zip)'
        type: boolean
        default: false
      test_filter:
        description: 'dotnet test --filter expression (empty = all tests)'
        type: string
        default: ''
      profile_only:
        description: 'Machine profiler --only patterns, comma-separated (empty = every machine)'
        type: string
        default: ''
  push:
    tags: [ 'fork-v*' ]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # bin64\dsplib.dll (upstream binary) needs the x64 VC++ 2010 runtime, which the runner
    # image lacks: without it every 64-bit native machine host dies at start (0xC0000135).
    # build.ps1 bundles it into the package from here; the tests need it installed.
    - name: Install VC++ 2010 runtime
      shell: pwsh
      run: choco install vcredist2010 -y --no-progress *> vcredist.log; if (-not (Test-Path "$env:WINDIR\System32\msvcr100.dll")) { Get-Content vcredist.log -Tail 20; throw 'msvcr100.dll (x64) not installed' }

    # The C++ projects target v145 (VS 2026). build.ps1 falls back to v143 when the
    # runner image only has VS 2022.
    - name: Build and package
      id: build
      shell: pwsh
      env:
        QUICK: ${{ inputs.quick }}
      run: |
        # Hashtable splatting: an array of '-Switch' strings would bind as positional arguments.
        $extra = @{}
        if ($env:QUICK -eq 'true') { $extra = @{ SkipManagedMachines = $true; SkipNativeMachines = $true; SkipBinaries = $true; NoZip = $true } }
        ./build.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}" @extra *>&1 | Tee-Object -FilePath build.log

    # Copies error lines and the log tail into annotations, readable through the API.
    - name: Annotate build log
      if: failure() && hashFiles('TestResults/*.trx') == ''
      shell: pwsh
      run: ./tools/ci-annotate-log.ps1 build.log

    - name: Upload package
      if: inputs.quick != true
      uses: actions/upload-artifact@v6
      with:
        name: rebuzz-fork-package
        path: dist/*.zip
        if-no-files-found: error

    - name: Attach to release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip

    # Upstream's NUnit suite (ReBuzzTests), built by build.ps1 as part of the solution.
    # It drives the real audio engine, so it catches regressions in the playback code.
    - name: Run ReBuzz tests
      timeout-minutes: 30
      shell: pwsh
      env:
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        $dll = Get-ChildItem build -Recurse -Filter ReBuzzTests.dll |
            Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $dll) { throw 'ReBuzzTests.dll not found under build\' }
        $filter = @()
        if ($env:TEST_FILTER) { $filter = @('--filter', $env:TEST_FILTER) }
        # UI tests (SessionViewTests) render PNGs here; published below.
        $env:SESSION_SCREENSHOT_DIR = Join-Path $PWD 'screenshots'
        # Link tests (SessionSyncTests) run the helper build.ps1 built.
        $link = Get-ChildItem build -Recurse -Filter ReBuzzLink.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($link) { $env:REBUZZ_LINK_HELPER = $link.FullName }
        # --blame-hang: a test stuck for 5 minutes (e.g. on a modal dialog) is killed and named.
        dotnet test $dll.FullName @filter --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=tests.trx" --results-directory TestResults --logger "console;verbosity=minimal" *>&1 | Tee-Object -FilePath test.log

    # Failed tests grouped by error, with message and top stack frames, as annotations.
    - name: Summarise tests
      if: always() && hashFiles('TestResults/*.trx') != ''
      timeout-minutes: 10
      shell: pwsh
      run: ./tools/ci-test-summary.ps1 TestResults/tests.trx

    # The agent server's evaluation (docs/specs/mcp-server.md §10, A6): ReBuzz.AgentEval drives the
    # built ReBuzz.exe --agent over MCP stdio, as a client does: the scripted checks, then each task's
    # setup, scripted reference solution and score. Runs in quick and full builds alike (the Neo
    # machines are part of the solution). Fails on a regression against eval/baseline.json; the
    # results are in the step summary, as annotations, and in the eval-results artifact.
    - name: Agent evaluation
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 15
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        dotnet build ReBuzz.AgentEval -c Release -nologo -v:q
        if ($LASTEXITCODE -ne 0) { throw 'ReBuzz.AgentEval did not build' }
        dotnet ReBuzz.AgentEval/bin/Release/net10.0/ReBuzz.AgentEval.dll run --exe $exe.FullName --out eval-out --baseline eval/baseline.json *>&1 | Tee-Object -FilePath eval.log
        exit $LASTEXITCODE

    - name: Upload evaluation results
      if: always() && hashFiles('eval-out/eval-results.json') != ''
      uses: actions/upload-artifact@v6
      with:
        name: eval-results
        path: |
          eval-out/*.json
          eval-out/*.md
          eval-out/tasks/**/*.md
          eval-out/tasks/**/*.bmxml
          eval-out/tasks/**/*.wav
          eval.log
        if-no-files-found: warn

    # The machine profiler (docs/specs/mcp-server.md §12.2, U1) through ReBuzz.exe --agent, which hosts the
    # native machines: every machine in its Gear (quick builds leave out the external ones). Draft manifests,
    # docs/machine-health.md and the summary go up as the machine-profile-windows artifact, to commit with
    # `python tools/machine-profiler.py --merge <artifact folder> --repo .`. They are also packed into the
    # log (--pack; --unpack takes them out of a downloaded job log), for where artifacts can't be fetched.
    # A machine that crashes or hangs is a finding (the profiler restarts ReBuzz and goes on), and the
    # step never fails the job. U2 (docs/specs/machine-safety.md §3.1) adds the level tests and
    # per-parameter sweeps: diverging, hot, needs a window, and safe ranges in the drafts. U2 in
    # depth (docs/specs/mcp-server.md §12.12): the test signal, suggested roles, velocity and envelope,
    # pitch by harmonic sieve, triggers, and slowdowns after the input goes silent.
    - name: Machine profile
      id: profile
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 75
      continue-on-error: true
      shell: pwsh
      env:
        PROFILE_ONLY: ${{ inputs.profile_only }}
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        $only = @()
        if ($env:PROFILE_ONLY) { $only = @('--only', $env:PROFILE_ONLY) }
        python tools/machine-profiler.py $exe.FullName --out machine-profile @only *>&1 | Tee-Object -FilePath machine-profile.log
        $code = $LASTEXITCODE
        if (Test-Path machine-profile/machine-profile.json) { python tools/machine-profiler.py --pack machine-profile }
        exit $code

    # U3 (docs/specs/mcp-server.md §12.9): each curated manifest whose machine this build has (the natives;
    # the Pedal machines too in a full build) against the machine itself: its ranges, and its own value texts
    # wherever the manifest keeps them. Fails on a disagreement.
    - name: Curated manifests against the machines
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 15
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        python tools/curated-check.py $exe.FullName curated-check
        exit $LASTEXITCODE

    # U4 (docs/specs/mcp-server.md §12.11): the curated natives' factory presets on the machines: each loads through
    # preset_load, sounds, at a consistent level, peaks below -1 dBFS, no NaN. Fails on a preset that doesn't.
    - name: Factory presets on the machines
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 20
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        python tools/preset-check.py $exe.FullName preset-check
        exit $LASTEXITCODE

    # U7 (docs/specs/mcp-server.md §12.14): the natives with sources, rebuilt by build.ps1 (step 4b, x86 and x64), against
    # the binaries upstream ships (RunTime/Gear): every build of each machine plays the same cases side by side in one
    # render, each probed (tools/native-compare.py). Fails when a machine the package ships rebuilt doesn't render as
    # upstream's does (bit for bit, or within -100 dBFS), or a pitched generator doesn't play the written pitch through
    # notes_write. A machine with a source fix, whose upstream instances start as their heap happens to be, is held instead
    # to the same bits in every instance of its own, x64 and x86, and to upstream's binary on a zeroed heap (the start the fix
    # gives; build-natives.ps1 -ZeroHeap) in every case. Full builds only (quick ones build no natives).
    - name: Natives, rebuilt against shipped
      if: (success() || failure()) && steps.build.outcome == 'success' && inputs.quick != true
      timeout-minutes: 40
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        ./tools/build-natives.ps1 -OutDir build/ExternalMachines/natives-zeroed -ZeroHeap
        if ($LASTEXITCODE -ne 0) { throw "upstream's binaries on a zeroed heap weren't made" }
        python tools/native-compare.py $exe.FullName native-compare --gate --pitch --json native-compare/native-compare.json `
          --variant R64=build/ExternalMachines/natives/x64/Gear --variant R86=build/ExternalMachines/natives/x86/Gear `
          --zeroed Z64=build/ExternalMachines/natives-zeroed/x64/Gear
        exit $LASTEXITCODE

    - name: Upload machine profile
      if: always() && hashFiles('machine-profile/machine-profile.json') != ''
      uses: actions/upload-artifact@v6
      with:
        name: machine-profile-windows
        path: |
          machine-profile/manifests/**
          machine-profile/*.json
          machine-profile/*.md
          machine-profile/work/*.stderr.txt
          machine-profile.log
        if-no-files-found: warn

    # The null test's references (docs/specs/mac-engine.md decision 6, M3/M4): every Neo machine, in
    # fixed cases, rendered by the built ReBuzz.exe --agent, one fresh process per case. The Linux and
    # macOS jobs below render the same cases with rebuzz-headless and compare, sample by sample.
    - name: Null test references
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 15
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter ReBuzz.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'ReBuzz.exe not found under bin\' }
        python tools/null-test.py render $exe.FullName null-ref
        exit $LASTEXITCODE

    - name: Upload null test references
      if: always() && hashFiles('null-ref/*.wav') != ''
      uses: actions/upload-artifact@v6
      with:
        name: null-test-references
        path: null-ref/*.wav
        if-no-files-found: error

    # Screenshots rendered by UI tests, force-pushed as a single commit to the ci-artifacts
    # branch: viewable in the repo (and fetchable with git) without downloading artifacts.
    - name: Publish screenshots
      if: always() && hashFiles('screenshots/*.png') != ''
      continue-on-error: true
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'ci-artifacts'
        New-Item -ItemType Directory -Force $dir | Out-Null
        Copy-Item screenshots/*.png $dir
        Set-Content (Join-Path $dir 'README.md') "Screenshots from run $env:GITHUB_RUN_ID of $env:GITHUB_REF_NAME at $env:GITHUB_SHA."
        Push-Location $dir
        git init -q -b ci-artifacts
        git add -A
        git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' commit -q -m "Screenshots: run $env:GITHUB_RUN_ID ($env:GITHUB_REF_NAME $env:GITHUB_SHA)"
        git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-artifacts
        Pop-Location
        Write-Host "::notice title=Screenshots::$((Get-ChildItem screenshots/*.png | ForEach-Object Name) -join ', ') pushed to ci-artifacts"

    # Why native engine hosts (ReBuzzEngine32/64.exe) die during tests: crash events from
    # the Windows event log, and a standalone start of the host against a named mapping.
    - name: Engine host diagnostics
      if: failure() && hashFiles('TestResults/*.trx') != ''
      continue-on-error: true
      shell: pwsh
      run: |
        $lines = @()
        $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error' } -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'ReBuzzEngine' } | Select-Object -First 3
        foreach ($e in $events) { $lines += ($e.Message -split "`r?`n" | Select-Object -First 12) -join ' | ' }
        if (-not $events) { $lines += 'No Application Error events for ReBuzzEngine.' }

        $loc = Get-ChildItem build -Recurse -Filter ReBuzzLocation.txt | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        $dir = if ($loc) { (Get-Content $loc.FullName -First 1).Trim() } else { '' }
        $lines += "ReBuzzLocation: $dir"
        foreach ($b in 'bin32', 'bin64') {
            $lines += "${b}: " + ((Get-ChildItem (Join-Path $dir $b) -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')
        }

        foreach ($exe in @((Join-Path $dir 'bin64\ReBuzzEngine64.exe'), (Join-Path $dir 'bin32\ReBuzzEngine32.exe'))) {
            if (-not (Test-Path $exe)) { $lines += "missing: $exe"; continue }
            $name = 'neo-buzz-probe-' + [guid]::NewGuid().ToString('N')
            $map = [System.IO.MemoryMappedFiles.MemoryMappedFile]::CreateNew($name, 64MB)
            $p = Start-Process $exe -ArgumentList $name -PassThru
            if ($p.WaitForExit(8000)) { $lines += ('{0}: exited with 0x{1:X8}' -f (Split-Path $exe -Leaf), $p.ExitCode) }
            else { $lines += ('{0}: still running after 8 s' -f (Split-Path $exe -Leaf)); $p.Kill() }
            $map.Dispose()
        }

        # Where the VC++ 2010 runtime that dsplib.dll (x64) imports is found, and whether a
        # copy of bin64 runs from a temp dir with a minimal PATH (as in the tests' root dir).
        $lines += 'where msvcr100.dll: ' + ((& where.exe msvcr100.dll 2>$null) -join ', ')
        $lines += 'System32\msvcr100.dll: ' + (Test-Path "$env:WINDIR\System32\msvcr100.dll") + '; SysWOW64\msvcr100.dll: ' + (Test-Path "$env:WINDIR\SysWOW64\msvcr100.dll")
        $copy = Join-Path $env:RUNNER_TEMP 'engine-copy'
        New-Item -ItemType Directory -Force $copy | Out-Null
        Get-ChildItem (Join-Path $dir 'bin64') -File | Copy-Item -Destination $copy
        $name = 'neo-buzz-probe-' + [guid]::NewGuid().ToString('N')
        $map = [System.IO.MemoryMappedFiles.MemoryMappedFile]::CreateNew($name, 64MB)
        $savedPath = $env:PATH
        $env:PATH = "$env:WINDIR\system32;$env:WINDIR"
        $p = Start-Process (Join-Path $copy 'ReBuzzEngine64.exe') -ArgumentList $name -WorkingDirectory $copy -PassThru
        $env:PATH = $savedPath
        if ($p.WaitForExit(8000)) { $lines += ('copy of bin64, minimal PATH: exited with 0x{0:X8}' -f $p.ExitCode) } else { $lines += 'copy of bin64, minimal PATH: still running after 8 s'; $p.Kill() }
        $map.Dispose()

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
        if ($dumpbin) {
            foreach ($exe in @((Join-Path $dir 'bin64\ReBuzzEngine64.exe'), (Join-Path $dir 'bin32\ReBuzzEngine32.exe'))) {
                $deps = & $dumpbin /dependents $exe | Select-String '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() }
                $lines += (Split-Path $exe -Leaf) + ' imports: ' + ($deps -join ', ')
            }
        }
        $i = 0
        foreach ($l in $lines) { $i++; Write-Host "::notice title=Engine diagnostics $i::$l" }

  # The null test (docs/specs/mac-engine.md decision 6, M3/M4): rebuzz-headless renders the same cases
  # as the package job's ReBuzz.exe, and each must be bit-identical to the Windows reference, every
  # sample. A case that differs reports its first differing sample and its largest difference (dBFS).
  # The per-case results are a notice annotation and in the step summary.
  null-test-linux:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build rebuzz-headless
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q

    - name: Download the Windows references
      uses: actions/download-artifact@v7
      with:
        name: null-test-references
        path: null-ref

    # libsndfile reads the waves the sampler's cases import (wave_import), as on Windows.
    - name: libsndfile
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libsndfile1

    - name: Null test, Linux x64 vs Windows
      run: python3 tools/null-test.py compare ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless null-ref "$RUNNER_TEMP/null-test"

    - name: Upload renders that differ
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: null-test-linux
        path: ${{ runner.temp }}/null-test/renders/*.wav
        if-no-files-found: ignore

  # The same on Apple silicon. macOS minutes cost about 10× Linux: this job runs once per package
  # run, after the references exist.
  null-test-macos:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build rebuzz-headless (osx-arm64)
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q

    - name: Download the Windows references
      uses: actions/download-artifact@v7
      with:
        name: null-test-references
        path: null-ref

    - name: libsndfile
      run: brew install libsndfile || true

    - name: Null test, macOS arm64 vs Windows
      run: python3 tools/null-test.py compare ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless null-ref "$RUNNER_TEMP/null-test"

    - name: Upload renders that differ
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: null-test-macos
        path: ${{ runner.temp }}/null-test/renders/*.wav
        if-no-files-found: ignore
