name: Fork package (NeoBuzz Live for Windows)

# Builds the Windows package with build.ps1 (the studio, its Neo machines, the plug-in host, the Link helper and the Pro warp
# mode), checks it and uploads the zip. Run it by hand from the Actions tab, or push a tag like fork-v0.1.0 to also attach
# the zip to a GitHub release.
#
# It also renders the null test's references (Neo machines, tools/null-test.py) and the clip goldens with rebuzz-headless on
# Windows; two jobs then render the same cases with rebuzz-headless on Linux and macOS and compare (docs/specs/mac-engine.md M3/M4).
#
# Manual input for test work: "quick" leaves out the zip.

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick: build and check the package folder only (no zip)'
        type: boolean
        default: false
  push:
    tags: [ 'fork-v*' ]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build and package
      id: build
      shell: pwsh
      env:
        QUICK: ${{ inputs.quick }}
      run: |
        # Hashtable splatting: an array of '-Switch' strings would bind as positional arguments.
        $extra = @{}
        if ($env:QUICK -eq 'true') { $extra = @{ NoZip = $true } }
        ./build.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}" @extra *>&1 | Tee-Object -FilePath build.log

    # Every .NET app in the package runs with methods that have loops compiled fully optimised at once, so the
    # audio thread never compiles an on-stack replacement (docs/specs/daw-modes.md §8.1, tools/msbuild/AudioThreadRuntime.props).
    - name: Runtime settings in the package
      if: steps.build.outcome == 'success'
      shell: pwsh
      run: |
        $app = Get-ChildItem dist -Directory | Where-Object Name -like 'NeoBuzz-Live-*-x64' | Select-Object -First 1
        $configs = Get-ChildItem (Join-Path $app.FullName 'App') -Filter *.runtimeconfig.json
        foreach ($c in $configs) { Write-Host "$($c.Name): $((Get-Content $c.FullName -Raw) -replace '\s+', ' ')" }
        $bad = $configs | Where-Object { -not ((Get-Content $_.FullName -Raw) -match '"System.Runtime.TieredCompilation.QuickJitForLoops":\s*false') }
        if (-not $configs -or $bad) { throw "quick JIT for loops not off in: $(($bad | ForEach-Object Name) -join ', ')" }

    # Copies error lines and the log tail into annotations, readable through the API.
    - name: Annotate build log
      if: failure()
      shell: pwsh
      run: ./tools/ci-annotate-log.ps1 build.log

    # The package as people get it is NeoBuzz Live (tools/package-check.py): NeoBuzz-Live-<version>-x64.zip (the folder alone in a
    # quick run), NeoBuzzLive.exe at its root starting App\ReBuzz.Studio.dll, its Gear, README-FIRST.txt and the licences.
    - name: Package check
      if: steps.build.outcome == 'success'
      timeout-minutes: 15
      shell: pwsh
      run: |
        python tools/package-check.py dist "$env:RUNNER_TEMP/package-check"
        exit $LASTEXITCODE

    - name: Upload package
      if: inputs.quick != true
      uses: actions/upload-artifact@v6
      with:
        name: NeoBuzz-Live-package
        path: dist/*.zip
        if-no-files-found: error

    - name: Attach to release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip

    # rebuzz-headless on Windows renders the references the Linux and macOS jobs compare with, and the clip goldens.
    # build.ps1 built neostretch.dll into build\NeoStretch, which the build copies beside it; libsndfile reads the waves.
    - name: Build rebuzz-headless
      if: (success() || failure()) && steps.build.outcome == 'success'
      shell: pwsh
      run: |
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -p:ReBuzzCleanBuild=true -nologo -v:q
        if ($LASTEXITCODE -ne 0) { throw 'rebuzz-headless did not build' }
        Copy-Item 3rdParty/libsndfile-1.dll ReBuzz.Headless/bin/Release/net10.0/ -Force

    # The null test's references (docs/specs/mac-engine.md decision 6, M3/M4): every Neo machine, in fixed cases, rendered by
    # rebuzz-headless --agent, one fresh process per case. The Linux and macOS jobs below render the same cases and compare, sample by sample.
    - name: Null test references
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 25
      shell: pwsh
      run: |
        python tools/null-test.py render ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless.exe null-ref
        exit $LASTEXITCODE

    - name: Upload null test references
      if: always() && hashFiles('null-ref/*.wav') != ''
      uses: actions/upload-artifact@v6
      with:
        name: null-test-references
        path: null-ref/*.wav
        if-no-files-found: error

    # The clip goldens (docs/specs/clips.md §10.1, CU1) with the real machines: the repo's template songs and one generated song,
    # rendered twice and compared with the hashes of eval/clip-goldens.json. Open times are reported.
    - name: Clip goldens
      if: (success() || failure()) && steps.build.outcome == 'success'
      timeout-minutes: 40
      shell: pwsh
      run: |
        python tools/clip-null.py check ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless.exe clip-work --twice
        $code = $LASTEXITCODE
        python tools/clip-null.py opentime ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless.exe clip-open
        exit $code

    - name: Upload the clip goldens observed
      if: always() && hashFiles('clip-work/observed.json') != ''
      uses: actions/upload-artifact@v6
      with:
        name: clip-goldens-windows
        path: |
          clip-work/observed.json
          clip-open/open-times.json
        if-no-files-found: ignore

    # NeoBuzz Live as the package has it (NeoBuzzLive.exe at its root; docs/specs/ux-overhaul.md P6): devices, its MCP server,
    # Neo Poly rendering, a saved song opened again, the transport and a clean quit (tools/studio-windows-smoke.py).
    - name: Studio smoke test (the package's NeoBuzzLive.exe)
      if: always() && steps.build.outcome == 'success'
      timeout-minutes: 30
      shell: pwsh
      run: |
        $pkg = (Get-ChildItem dist -Directory | Where-Object Name -like 'NeoBuzz-Live-*-x64' | Select-Object -First 1).FullName
        python tools/studio-windows-smoke.py "$pkg\NeoBuzzLive.exe" "$env:RUNNER_TEMP\studio-package-smoke"
        exit $LASTEXITCODE

  # NeoBuzz Live (the studio) on Windows (docs/specs/ux-overhaul.md P6): the studio (ReBuzz.Studio, Avalonia) on a Windows
  # runner. Its headless tests there, its headless UI gallery drawn on Windows (win-NNN-*.png, pushed to the branch
  # ci-artifacts-studio-windows), then it is published for win-x64 with PortAudio built from source with CMake
  # (tools/build-portaudio.ps1: MME, DirectSound, WASAPI and WDM-KS, no ASIO) and the published NeoBuzzLive.exe is
  # smoke-tested (tools/studio-windows-smoke.py): devices listed, started, its MCP server answers, a song plays on the null
  # device and renders, the window closes cleanly. The package job above puts the same folder in the zip and smoke-tests that too.
  studio-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write       # the gallery's branch (ci-artifacts-studio-windows)
    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Neo Audio's Pro warp mode (docs/specs/neo-audio.md section 11): neostretch.dll with MSVC, its own test, and beside the studio's tests.
    - name: NeoStretch (CMake, MSVC)
      shell: pwsh
      run: |
        cmake -S NeoStretch -B build/NeoStretch -A x64
        cmake --build build/NeoStretch --config Release
        ctest --test-dir build/NeoStretch -C Release --output-on-failure
        if ($LASTEXITCODE -ne 0) { throw "neostretch-test failed" }

    - name: Studio tests (headless, Windows)
      shell: pwsh
      run: dotnet test ReBuzz.Studio.Tests -p:ReBuzzCleanBuild=true --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath studio-test.log

    - name: Failed studio tests
      if: failure()
      shell: pwsh
      run: |
        Select-String -Path studio-test.log -Pattern '^\s*Failed ' | Select-Object -First 60 | ForEach-Object { Write-Host $_.Line }
        Select-String -Path studio-test.log -Pattern 'Failed!|Passed!' | ForEach-Object { Write-Host $_.Line }

    # The UI gallery on Windows (ux-overhaul.md P6c, docs/specs/ui-gallery.md): the headless gallery of the Mac job, drawn here with
    # Windows' fonts and the Windows engine (GALLERY_PREFIX=win: win-NNN-*.png, index-win.md), in the Dark and the Light theme.
    # Not a gate: a shot that fails is in the index; the pictures are what the step is for.
    - name: Headless gallery (Windows fonts)
      if: always()
      continue-on-error: true
      timeout-minutes: 40
      shell: pwsh
      env:
        GALLERY_PREFIX: win
      run: |
        $env:GALLERY_DIR = Join-Path $PWD 'gallery/dark'
        dotnet test ReBuzz.Studio.Tests -p:ReBuzzCleanBuild=true --filter TestCategory=Gallery --logger "console;verbosity=normal" *>&1 | Select-String -Pattern 'gallery\]|Passed |Failed |Total tests|error' | ForEach-Object { Write-Host $_.Line }
        $env:GALLERY_DIR = Join-Path $PWD 'gallery/light'
        $env:GALLERY_THEME = 'light'
        dotnet test ReBuzz.Studio.Tests -p:ReBuzzCleanBuild=true --filter TestCategory=Gallery --logger "console;verbosity=normal" *>&1 | Select-String -Pattern 'gallery\]|Passed |Failed |Total tests|error' | ForEach-Object { Write-Host $_.Line }
        exit 0

    - name: Publish the gallery to ci-artifacts-studio-windows
      if: always() && hashFiles('gallery/**/*.png') != ''
      continue-on-error: true
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'ci-artifacts-studio-windows'
        New-Item -ItemType Directory -Force $dir | Out-Null
        Copy-Item gallery/* $dir -Recurse
        Set-Content (Join-Path $dir 'README.md') "Windows UI gallery of the studio (headless, Windows fonts) from run $env:GITHUB_RUN_ID of $env:GITHUB_REF_NAME at $env:GITHUB_SHA. dark/ and light/."
        Push-Location $dir
        git init -q -b ci-artifacts-studio-windows
        git add -A
        git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' commit -q -m "Windows studio gallery: run $env:GITHUB_RUN_ID ($env:GITHUB_REF_NAME $env:GITHUB_SHA)"
        git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-artifacts-studio-windows
        Pop-Location
        Write-Host "::notice title=Windows studio gallery::$((Get-ChildItem gallery -Recurse -Filter *.png).Count) pictures pushed to ci-artifacts-studio-windows"

    - name: Publish the studio (win-x64) with PortAudio from source
      if: always()
      shell: pwsh
      run: ./tools/publish-studio-windows.ps1 -Out build/Studio

    - name: Studio smoke test (published exe)
      if: always() && hashFiles('build/Studio/NeoBuzzLive.exe') != ''
      timeout-minutes: 25
      shell: pwsh
      run: |
        python tools/studio-windows-smoke.py "$PWD\build\Studio\NeoBuzzLive.exe" "$env:RUNNER_TEMP\studio-smoke"
        exit $LASTEXITCODE

    - name: Zip the studio
      if: always() && hashFiles('build/Studio/NeoBuzzLive.exe') != ''
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Compress-Archive -Path build/Studio/* -DestinationPath dist/NeoBuzz-Live-Studio-preview-win-x64.zip -CompressionLevel Optimal

    - name: Upload the studio
      if: always() && hashFiles('dist/*.zip') != ''
      uses: actions/upload-artifact@v6
      with:
        name: NeoBuzz-Live-Studio-preview-win-x64
        path: dist/*.zip

  # The null test (docs/specs/mac-engine.md decision 6, M3/M4): rebuzz-headless renders the same cases
  # as the package job's rebuzz-headless on Windows, and each must be bit-identical to the Windows reference, every
  # sample. A case that differs reports its first differing sample and its largest difference (dBFS).
  # The per-case results are a notice annotation and in the step summary.
  null-test-linux:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Neo Audio's Pro warp mode (docs/specs/neo-audio.md section 11): the neostretch library built and tested on this platform too.
    - name: NeoStretch (CMake)
      run: |
        cmake -S NeoStretch -B build/NeoStretch
        cmake --build build/NeoStretch -j 3
        ctest --test-dir build/NeoStretch --output-on-failure

    - name: Build rebuzz-headless
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q

    - name: Download the Windows references
      uses: actions/download-artifact@v7
      with:
        name: null-test-references
        path: null-ref

    # libsndfile reads the waves the sampler's cases import (wave_import), as on Windows.
    - name: libsndfile
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libsndfile1

    - name: Null test, Linux x64 vs Windows
      run: python3 tools/null-test.py compare ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless null-ref "$RUNNER_TEMP/null-test"

    - name: Upload renders that differ
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: null-test-linux
        path: ${{ runner.temp }}/null-test/renders/*.wav
        if-no-files-found: ignore

  # The same on Apple silicon. macOS minutes cost about 10× Linux: this job runs once per package
  # run, after the references exist.
  null-test-macos:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Neo Audio's Pro warp mode (docs/specs/neo-audio.md section 11): the neostretch library built and tested on this platform too.
    - name: NeoStretch (CMake)
      run: |
        cmake -S NeoStretch -B build/NeoStretch
        cmake --build build/NeoStretch -j 3
        ctest --test-dir build/NeoStretch --output-on-failure

    - name: Build rebuzz-headless (osx-arm64)
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q

    - name: Download the Windows references
      uses: actions/download-artifact@v7
      with:
        name: null-test-references
        path: null-ref

    - name: libsndfile
      run: brew install libsndfile || true

    - name: Null test, macOS arm64 vs Windows
      run: python3 tools/null-test.py compare ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless null-ref "$RUNNER_TEMP/null-test"

    - name: Upload renders that differ
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: null-test-macos
        path: ${{ runner.temp }}/null-test/renders/*.wav
        if-no-files-found: ignore

  # Plug-in host (docs/specs/plugin-host.md, H1): neoplug built with CMake, Surge XT (CLAP and VST3), the SDK's AGain and Note
  # Expression Synth and our test plug-ins hosted by Neo Plug / Neo Plug FX in rebuzz-headless: load, play, save, reload.
  plugin-host-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Plug-in host (native build, Surge XT, round trip)
      run: tools/ci-plugin-host.sh

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: plugin-host-windows
        path: plugin-host-results
        if-no-files-found: ignore
