name: Fork package (ReBuzz + all machines)

# Builds the whole solution plus ExternalMachines with build.ps1 and uploads the zip.
# Run it by hand from the Actions tab, or push a tag like fork-v0.1.0 to also attach
# the zip to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags: [ 'fork-v*' ]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # The C++ projects target v145 (VS 2026). build.ps1 falls back to v143 when the
    # runner image only has VS 2022.
    - name: Build and package
      shell: pwsh
      run: ./build.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}" *>&1 | Tee-Object -FilePath build.log

    # Copies error lines and the log tail into annotations, readable through the API.
    - name: Annotate build log
      if: failure() && hashFiles('test.log') == ''
      shell: pwsh
      run: ./tools/ci-annotate-log.ps1 build.log

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: rebuzz-fork-package
        path: dist/*.zip
        if-no-files-found: error

    - name: Attach to release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip

    # Upstream's NUnit suite (ReBuzzTests), built by build.ps1 as part of the solution.
    # It drives the real audio engine, so it catches regressions in the playback code.
    - name: Run ReBuzz tests
      shell: pwsh
      run: |
        $dll = Get-ChildItem build -Recurse -Filter ReBuzzTests.dll |
            Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $dll) { throw 'ReBuzzTests.dll not found under build\' }
        Write-Host "::notice title=Tests::$($dll.FullName)"
        dotnet test $dll.FullName --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath test.log

    - name: Annotate test log
      if: failure() && hashFiles('test.log') != ''
      shell: pwsh
      run: ./tools/ci-annotate-log.ps1 test.log
