name: Plugin export spike

# experiments/plugin-export (branch experiments/plugin-export-px0): Neo Filter as a CLAP plug-in written in C#, the DSP and the
# editor as two NativeAOT libraries (two runtimes, two GCs), wrapped by clap-wrapper into VST3 (and AU on macOS).
# Per OS: the managed self-test, the NativeAOT publish, the CMake build (stub + wrappers + bench), the bench's functional
# self-test, then the GC measurement (control, editor in its own runtime, load in the DSP runtime). On Linux also the null test
# of the CLAP and the VST3 against the native machine in rebuzz-headless (Neo Plug FX), and on macOS the AU through auval.
#
# Only this branch drives it (push); a plain push runs Linux with 20 s per configuration, "[mac]" adds macOS, "[win]" Windows,
# "[full]" all three with 300 s per configuration.
on:
  push:
    branches: [ experiments/plugin-export-px0 ]
    paths:
      - 'experiments/plugin-export/**'
      - 'Machines/NeoFilter/Engine/**'
      - 'Machines/NeoBuzz.Dsp/**'
      - '.github/workflows/plugin-export.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: Recorded seconds per configuration
        default: '300'
      mac:
        type: boolean
        default: true
      win:
        type: boolean
        default: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
    - id: m
      env:
        MSG: ${{ github.event.head_commit.message }}
        EVENT: ${{ github.event_name }}
        MAC_IN: ${{ inputs.mac }}
        WIN_IN: ${{ inputs.win }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        msg, ev = os.environ['MSG'], os.environ['EVENT']
        full = '[full]' in msg
        mac = (ev == 'push' and (full or '[mac]' in msg)) or (ev != 'push' and os.environ['MAC_IN'] == 'true')
        win = (ev == 'push' and (full or '[win]' in msg)) or (ev != 'push' and os.environ['WIN_IN'] == 'true')
        inc = [{'os': 'ubuntu-latest', 'rid': 'linux-x64', 'name': 'linux'}]
        if mac: inc.append({'os': 'macos-15', 'rid': 'osx-arm64', 'name': 'macos'})
        if win: inc.append({'os': 'windows-latest', 'rid': 'win-x64', 'name': 'windows'})
        print('matrix=' + json.dumps({'include': inc}))
        PY

  export:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      SECONDS_PER_RUN: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[full]') && '300' || '20') || inputs.seconds }}
      INSTANCES: '16'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Machine
      run: |
        echo "os=${{ matrix.os }} seconds=$SECONDS_PER_RUN"
        if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; uname -a
        elif [ "$RUNNER_OS" = Linux ]; then nproc; grep -m1 "model name" /proc/cpuinfo; free -m | head -2
        else echo "cpus=$NUMBER_OF_PROCESSORS"; fi
        dotnet --version

    - name: System packages
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang zlib1g-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libxcb-keysyms1-dev
        elif [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi

    - name: Self-test (the CLAP exports under CoreCLR, against the engine)
      run: dotnet run --project experiments/plugin-export/selftest -c Release 2>&1 | tee selftest.log | tail -40; grep -q "^ALL OK" selftest.log

    - name: Publish the NativeAOT libraries (DSP, editor)
      run: |
        dotnet publish experiments/plugin-export/dsp/NeoFilterDsp.csproj -c Release -r ${{ matrix.rid }} -o "$PWD/_publish_dsp" 2>&1 | grep -E "error|warning IL|Generating|neofilter" | sort -u | head -30
        dotnet publish experiments/plugin-export/editor/NeoEditorLib.csproj -c Release -r ${{ matrix.rid }} -o "$PWD/_publish_editor" 2>&1 | grep -E "error|warning IL|Generating|neoeditor" | sort -u | head -30
        ls -la _publish_dsp _publish_editor | head -30
        ls _publish_dsp | grep -q "neofilter_dsp" && ls _publish_editor | grep -q "neoeditor"

    - name: SDKs (CLAP 1.2.10, VST3 SDK 3.8.1, clap-wrapper, AudioUnitSDK)
      run: |
        T="$RUNNER_TEMP"
        git clone -q --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk "$T/vst3sdk"
        git -C "$T/vst3sdk" -c advice.detachedHead=false submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake vstgui4
        # clap-wrapper 0.17 builds against the VST3 SDK it pins (3.8.0); 3.8.1 renamed a member its macros use. Our plug-in host (null test) uses 3.8.1.
        git clone -q --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk "$T/vst3sdk380"
        git -C "$T/vst3sdk380" -c advice.detachedHead=false submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake
        git -c advice.detachedHead=false clone -q --depth 1 --branch 1.2.10 https://github.com/free-audio/clap "$T/clap"
        mkdir "$T/cw" && git -C "$T/cw" init -q && git -C "$T/cw" fetch -q --depth 1 https://github.com/free-audio/clap-wrapper 806bba0a5f792e3966b99c1561ab9952d3316d7c && git -C "$T/cw" -c advice.detachedHead=false checkout -q FETCH_HEAD
        git -C "$T/cw" log -1 --format='clap-wrapper %h %cd'
        if [ "$RUNNER_OS" = macOS ]; then git -c advice.detachedHead=false clone -q --depth 1 --branch AudioUnitSDK-1.1.0 https://github.com/apple/AudioUnitSDK "$T/AudioUnitSDK"; fi

    - name: Build the stub, the wrappers and the bench (CMake)
      run: |
        T="$RUNNER_TEMP"; [ "$RUNNER_OS" = Windows ] && T=$(cygpath -m "$RUNNER_TEMP")
        case "$RUNNER_OS" in
          Windows) gen=(-A x64) ;;
          macOS) gen=(-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 "-DAUDIOUNIT_SDK_ROOT=$T/AudioUnitSDK") ;;
          *) gen=(-G Ninja) ;;
        esac
        cmake -S experiments/plugin-export -B _build "${gen[@]}" -DCMAKE_BUILD_TYPE=Release -DCLAP_SDK_ROOT="$T/clap" -DVST3_SDK_ROOT="$T/vst3sdk380" -DCLAP_WRAPPER_DIR="$T/cw" 2>&1 | tail -15
        cmake --build _build --config Release -j 4 > build.log 2>&1 || { grep -E -B3 -A6 "FAILED|error|undefined|relocation" build.log | cut -c1-300 | head -60; exit 1; }
        tail -2 build.log
        find _build/neofilter_assets -maxdepth 3 | head -30
        find _build -maxdepth 2 -name 'clapbench*' -type f

    - name: Stage (the AOT libraries next to every module)
      run: python3 experiments/plugin-export/ci/stage.py _build/neofilter_assets _publish_dsp _publish_editor

    - name: Bench self-test through the CLAP ABI (parameters, state, gui, editor ring)
      run: |
        if [ "$RUNNER_OS" = Windows ]; then B=$(find _build -name clapbench.exe | head -1); C=$(find _build/neofilter_assets -name '*.clap' | head -1)
        elif [ "$RUNNER_OS" = macOS ]; then B=_build/clapbench; C=$(find _build/neofilter_assets -path '*.clap/Contents/MacOS/*' -type f ! -name '*.dylib' | head -1)
        else B=_build/clapbench; C="_build/neofilter_assets/Neo Filter.clap"; fi
        echo "bench=$B clap=$C"; ls -la "$C"
        "$B" --clap "$C" --selftest 2>&1 | tee bench-selftest.log
        grep -q "^SELFTEST ok" bench-selftest.log

    - name: AU through auval (macOS)
      if: runner.os == 'macOS'
      continue-on-error: true
      run: |
        mkdir -p ~/Library/Audio/Plug-Ins/Components
        cp -R "_build/neofilter_assets/Neo Filter.component" ~/Library/Audio/Plug-Ins/Components/ || find _build/neofilter_assets -name '*.component'
        sleep 3
        auval -a 2>&1 | grep -i -E "NBuz|Neo" || echo "not listed by auval -a"
        auval -v aufx NFlt NBuz 2>&1 | tail -40 | tee auval.log
        grep -q "AU VALIDATION SUCCEEDED" auval.log

    - name: Null test against the native machine in rebuzz-headless (Linux)
      if: runner.os == 'Linux'
      id: nulltest
      continue-on-error: true
      run: |
        T="$RUNNER_TEMP"
        cmake -S PluginHost -B build/PluginHost -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEOPLUG_VST3_SDK="$T/vst3sdk" -DNEOPLUG_CLAP="$T/clap" -DNEOPLUG_FIXTURES=OFF 2>&1 | tail -2
        cmake --build build/PluginHost -j 4 2>&1 | tail -2
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -v:q 2>&1 | grep -E " error |Build succeeded" | sort -u
        F="$T/export-plugins"; mkdir -p "$F"
        cp "_build/neofilter_assets/Neo Filter.clap" _publish_dsp/neofilter_dsp.so _publish_editor/neoeditor.so "$F/"
        cp -R "_build/neofilter_assets/Neo Filter.vst3" "$F/"
        find "$F" | head -20
        G=ReBuzz.Headless/bin/Release/net10.0/Gear/NeoPlug
        export NEOPLUG_DEBUG=1
        python3 experiments/plugin-export/ci/null-test.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$PWD/nulltest" --dir "$F" --lib "$G/libneoplug.so" --scan "$G/neoplug-scan" 2>&1 | tee null-test.log | grep -v "^     \(gear_list\|song_\|machine_add\|pattern\|notes\|arrange\|connect\|render\)" | tail -60
        grep -q "^NULL-TEST ok" null-test.log
        grep -E "\[neoplug\]|Neo Filter" nulltest/stderr.txt | head -20 || true

    - name: Measure (control, editor in its own runtime, load in the DSP runtime)
      run: |
        set -u
        if [ "$RUNNER_OS" = Windows ]; then B=$(find _build -name clapbench.exe | head -1); C=$(find _build/neofilter_assets -name '*.clap' | head -1)
        elif [ "$RUNNER_OS" = macOS ]; then B=_build/clapbench; C=$(find _build/neofilter_assets -path '*.clap/Contents/MacOS/*' -type f ! -name '*.dylib' | head -1)
        else B=_build/clapbench; C="_build/neofilter_assets/Neo Filter.clap"; fi
        OUT=results-${{ matrix.name }}.txt; : > "$OUT"
        SUDO=""; [ "$RUNNER_OS" = Linux ] && SUDO="sudo -E"
        run() { $SUDO "$B" --clap "$C" --block 64 --seconds "$SECONDS_PER_RUN" --instances "$INSTANCES" "$@" 2>&1 | tee -a "$OUT"; }
        run --mode none   --load 0 --label ctl-start
        run --mode editor --load 0 --label editor-L0
        run --mode editor --load 1 --label editor-L1
        run --mode editor --load 3 --label editor-L3
        run --mode inproc --load 1 --label oneruntime-L1
        run --mode inproc --load 3 --label oneruntime-L3
        run --mode none   --load 0 --label ctl-end
        python3 experiments/plugin-export/ci/summarize.py "$OUT" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

    - name: Null test verdict
      if: runner.os == 'Linux' && steps.nulltest.outcome == 'failure'
      run: echo "::error::the null test failed (see its step)"; exit 1
