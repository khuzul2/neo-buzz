name: Fork CI

# Fast checks for fork work:
#  - session-tests: Session View engine unit tests, the agent server's core, the Neo
#    machines' DSP measurements and the engine's net10.0 build (Linux, a few minutes)
#  - core-build: compiles ReBuzz.exe and its C# dependencies only (no C++ projects), and checks
#    that the portable machine API is a subset of the Windows one
# The full solution + package build is fork-package.yml.

# Pushes to main and PRs only (not every branch push), to keep Actions minutes down on a
# private repo. Windows minutes count double.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  session-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # PortAudio for the Mac engine's audio binding (docs/specs/mac-engine.md M5), tested here on
    # Linux: same LP64 ABI as macOS. The runner has no sound card, so a PulseAudio server with a
    # null sink is the default device (PortAudio 19.7 initialises its PulseAudio host, and fails
    # without a server): streams open and run their callbacks in real time, and play nothing.
    - name: PortAudio
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libportaudio2 libsndfile1 pulseaudio pulseaudio-utils xvfb xauth libice6 libsm6
        pulseaudio -D --exit-idle-time=-1 --system=false
        pactl load-module module-null-sink sink_name=ci_null
        pactl set-default-sink ci_null
        pactl info | grep -i "default sink"

    # The Ableton Link helper (mac-engine.md M6), built with CMake as on macOS. The seam tests run
    # it (its clock must be Stopwatch's: CLOCK_MONOTONIC here); rebuzz-headless's build copies it.
    - name: Link helper (CMake)
      run: |
        git submodule update --init --recursive --depth 1 LinkHelper/link
        cmake -S LinkHelper -B build/LinkHelper
        cmake --build build/LinkHelper -j 4

    - name: Test
      shell: pwsh
      env:
        REBUZZ_LINK_HELPER: ${{ github.workspace }}/build/LinkHelper/ReBuzzLink
      run: dotnet test ReBuzz.SessionTests --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath test.log

    # Agent server core (docs/specs/mcp-server.md): MCP protocol, stdio and HTTP transports, engine queue.
    - name: Agent server tests
      if: always()
      shell: pwsh
      run: dotnet test ReBuzz.AgentTests --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath agent-test.log

    # The agent server's evaluation (docs/specs/mcp-server.md §10): its MCP client against our
    # protocol layer, its scorers on synthetic signals and its regression gate. The suite itself
    # runs on Windows in fork-package.yml.
    - name: Agent evaluation self-test
      if: always()
      run: dotnet run --project ReBuzz.AgentEval -c Release -- selftest

    # Neo machines (docs/specs/machines.md): aliasing, decay times, envelopes, presets…
    - name: Machine DSP tests
      if: always()
      shell: pwsh
      env:
        MEASUREMENTS_DIR: ${{ github.workspace }}/measurements
      run: dotnet test NeoBuzz.MachineTests --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath machine-test.log

    # U6 (docs/specs/mcp-server.md §12.13): the Neo measurement suite on the Pedal effects U6 changed, run on their
    # own Work: silence after sound settles to exact zero (no denormals), blocks of 256 and 117 alike, nothing
    # allocated per block, levels and NaN at every parameter's ends, the Shaper's aliasing, parameter changes that glide,
    # and silence reported only once a tail is silent.
    - name: Pedal effect tests
      if: always()
      shell: pwsh
      env:
        MEASUREMENTS_DIR: ${{ github.workspace }}/measurements
      run: dotnet test NeoBuzz.PedalTests --logger "console;verbosity=normal" *>&1 | Tee-Object -FilePath pedal-test.log

    - name: Pedal effect measurements
      if: always() && hashFiles('measurements/pedal-measurements.txt') != ''
      shell: pwsh
      run: |
        # In notices of up to 3800 characters each (an annotation's limit), whole lines.
        $lines = Get-Content measurements/pedal-measurements.txt | Sort-Object
        $chunks = @(); $cur = ""
        foreach ($l in $lines) {
          if ($cur.Length -gt 0 -and $cur.Length + $l.Length + 1 -gt 3800) { $chunks += $cur; $cur = "" }
          $cur = if ($cur.Length -gt 0) { "$cur`n$l" } else { $l }
        }
        if ($cur.Length -gt 0) { $chunks += $cur }
        for ($i = 0; $i -lt $chunks.Count; $i++) {
          Write-Host "::notice title=Pedal effect measurements ($($i + 1)/$($chunks.Count))::$($chunks[$i] -replace '%', '%25' -replace "`n", '%0A')"
        }

    # The measured figures (aliasing, decay times, speed…) as one notice, readable through the API.
    - name: Machine measurements
      if: always() && hashFiles('measurements/machine-measurements.txt') != ''
      shell: pwsh
      run: |
        $lines = Get-Content measurements/machine-measurements.txt | Sort-Object
        $text = ($lines -join "`n")
        if ($text.Length -gt 3800) { $text = $text.Substring(0, 3800) }
        Write-Host "::notice title=Machine measurements::$($text -replace '%', '%25' -replace "`n", '%0A')"

    # The portable (net10.0) builds of BuzzGUI.Interfaces and BuzzGUI.Common (docs/specs/engine-split.md §4).
    - name: Portable machine API
      if: always()
      run: dotnet build ReBuzzGUI/BuzzGUI.Common/BuzzGUI.Common.csproj -nologo -v:q

    # The engine (docs/specs/engine-split.md §5, PR 10): ReBuzz.Engine builds as plain net10.0,
    # with no WPF and no Windows targeting; ReBuzz.exe references it. This replaced the census
    # ratchet. The engine references the vendored Serilog, a submodule (engine-split.md S10).
    - name: Engine (net10.0)
      if: always()
      run: |
        git submodule update --init --depth 1 3rdParty/serilog/serilog
        dotnet build ReBuzz.Engine/ReBuzz.Engine.csproj -nologo -v:q

    # rebuzz-headless (docs/specs/mac-engine.md M1): the engine with the MCP server on stdio, no UI
    # toolkit, with the Neo machines built for net10.0. The smoke test drives it as a client does:
    # a chord through Neo Poly and Neo Verb, rendered, measured, saved, reopened, undone.
    - name: Headless engine on Linux
      if: always()
      run: |
        dotnet build ReBuzz.Headless/ReBuzz.Headless.csproj -c Release -nologo -v:q
        # Methods with loops compiled fully optimised at once (daw-modes.md §8.1, tools/msbuild/AudioThreadRuntime.props).
        grep -Eq '"System.Runtime.TieredCompilation.QuickJitForLoops": *false' ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless.runtimeconfig.json || { echo "::error::rebuzz-headless.runtimeconfig.json doesn't turn quick JIT for loops off"; exit 1; }
        python3 tools/headless-smoke.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/smoke"

    # The Pedal machines (docs/specs/studio-mvp.md S2), built for net10.0 without their WPF GUIs:
    # each loads, the synths play a note, the effects pass a chord, Chord and LFO drive their targets.
    - name: Pedal machines on Linux
      if: always()
      run: python3 tools/headless-pedal.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/pedal"

    # The machine profiler (docs/specs/mcp-server.md §12.2, U1): its unit and mapping inference on known
    # value tables, then every machine rebuzz-headless has (Neo and Pedal) profiled; the drafts, the
    # health report and the summary are uploaded. Then the committed drafts at work: a Pedal synth plays
    # A4 at 440 Hz through notes_write, param_set takes units on Pedal machines, unhealthy ones are flagged.
    # U2 (docs/specs/machine-safety.md §3.1, §3.4): diverging, hot and needs-a-window, per-parameter
    # sweeps and safe ranges, which param_set keeps agents inside unless they pass allow_unsafe.
    - name: Machine profiler inference tests
      if: always()
      run: python3 -m unittest discover -s tools -p "test_*.py" -v

    # Without U2's per-parameter sweeps (--no-roles), which took this step from about 4 to 12 minutes on
    # every change: the roles come from the package job's profile (every machine, Windows), and the health,
    # test signal, velocity, envelope, triggers and slowdown checks still run here.
    - name: Machine profile on Linux
      if: always()
      run: python3 tools/machine-profiler.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless --out "$RUNNER_TEMP/machine-profile" --no-roles

    - name: Upload machine profile
      if: always() && hashFiles('**/machine-profile.json') != ''
      uses: actions/upload-artifact@v6
      with:
        name: machine-profile-linux
        path: |
          ${{ runner.temp }}/machine-profile/manifests/**
          ${{ runner.temp }}/machine-profile/*.json
          ${{ runner.temp }}/machine-profile/*.md
        if-no-files-found: warn

    - name: Draft manifests at work on Linux
      if: always()
      run: python3 tools/headless-manifests.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/manifests"

    # U3 (docs/specs/mcp-server.md §12.9): each curated Pedal manifest against the machine itself (its
    # ranges, and its own value texts wherever the manifest keeps them). The natives: the package job.
    - name: Curated manifests against the machines on Linux
      if: always()
      run: python3 tools/curated-check.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/curated"

    # U4 (docs/specs/mcp-server.md §12.11): the curated Pedal machines' factory presets on the machines: each loads through
    # preset_load, sounds, at a consistent level, peaks below -1 dBFS, no NaN (--theirs also reports the banks they ship).
    # The natives: the package job.
    - name: Factory presets on the machines on Linux
      if: always()
      run: python3 tools/preset-check.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/presets" --theirs

    # U5 (docs/specs/mcp-server.md §12.5): machine_replace with the portable machines. Pedal EQ → Neo EQ, Pedal Gain →
    # Neo Utility and Pedal Comp → Neo Comp within their stated tolerance; the successor in the old one's place with
    # its settings, automation, arrangement and session track; one undo brings the original back. The natives: the package job.
    - name: machine_replace on Linux
      if: always()
      run: python3 tools/headless-replace.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/replace"

    # Live audio (mac-engine.md M5): rebuzz-headless --audio through PortAudio on the PulseAudio
    # null sink (clocked, so in real time); the live tools play, meter and stop it. The null sink
    # through ALSA's PulseAudio plugin takes nothing for about 2 s after an underrun, and at its
    # 8.7 ms default one late buffer is one: PULSE_LATENCY_MSEC gives it 100 ms to absorb them.
    - name: Live audio on Linux (PortAudio)
      if: always()
      env:
        PULSE_LATENCY_MSEC: 100
      run: python3 tools/headless-live.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/live"

    # The A6 scripted suite (docs/specs/mcp-server.md §10) against rebuzz-headless on Linux
    # (mac-engine.md M3): the same checks, tasks and baseline as the Windows package run.
    - name: Agent evaluation on Linux (rebuzz-headless)
      if: always()
      run: |
        dotnet build ReBuzz.AgentEval/ReBuzz.AgentEval.csproj -c Release -nologo -v:q
        dotnet ReBuzz.AgentEval/bin/Release/net10.0/ReBuzz.AgentEval.dll run --exe ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless --out "$RUNNER_TEMP/eval" --baseline eval/baseline.json

    # Songs with missing machines (mac-engine.md M2): off Windows every native machine is a
    # placeholder, which must save back what the song says about it. The demo songs open, save as
    # BMX and BMXML, reopen and save again: the two saves are identical, and the first keeps every
    # machine's values, data, attributes, tracks and pattern contents. So does a Windows-style song
    # whose pattern editor machines are missing too.
    - name: Songs with placeholders round-trip
      if: always()
      run: python3 tools/song-roundtrip.py ReBuzz.Headless/bin/Release/net10.0/rebuzz-headless "$RUNNER_TEMP/roundtrip"

    # The studio (docs/specs/studio-mvp.md): its views drawn headless (Avalonia.Headless with Skia)
    # and driven by simulated input; what they drew is uploaded with the run.
    - name: Studio (Avalonia, headless)
      if: always()
      shell: bash
      env:
        SCREENSHOTS_DIR: ${{ github.workspace }}/studio-screenshots
      run: dotnet test ReBuzz.Studio.Tests --logger "console;verbosity=normal" 2>&1 | tee studio-test.log

    # P3's exit (studio-mvp.md S9): the studio app itself, on Xvfb's display with the PulseAudio null
    # sink, agents allowed on a free port for this run; the A7 live scenarios against it over HTTP.
    # PULSE_LATENCY_MSEC as for rebuzz-headless above.
    - name: The studio's MCP server, live (Xvfb)
      if: always()
      env:
        PULSE_LATENCY_MSEC: 100
      run: |
        dotnet build ReBuzz.Studio/ReBuzz.Studio.csproj -c Release -nologo -v:q
        grep -Eq '"System.Runtime.TieredCompilation.QuickJitForLoops": *false' ReBuzz.Studio/bin/Release/net10.0/ReBuzz.Studio.runtimeconfig.json || { echo "::error::ReBuzz.Studio.runtimeconfig.json doesn't turn quick JIT for loops off"; exit 1; }
        xvfb-run -a python3 tools/headless-live.py --studio ReBuzz.Studio/bin/Release/net10.0/ReBuzz.Studio "$RUNNER_TEMP/studio-live"

    - name: Studio screenshots
      if: always() && hashFiles('studio-screenshots/*.png') != ''
      uses: actions/upload-artifact@v6
      with:
        name: studio-screenshots
        path: studio-screenshots/

    - name: Annotate test log
      if: failure()
      shell: pwsh
      run: |
        if (Test-Path test.log) { ./tools/ci-annotate-log.ps1 test.log }
        if (Test-Path machine-test.log) { ./tools/ci-annotate-log.ps1 machine-test.log }
        if (Test-Path pedal-test.log) { ./tools/ci-annotate-log.ps1 pedal-test.log }
        if (Test-Path agent-test.log) { ./tools/ci-annotate-log.ps1 agent-test.log }

  core-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # The projects place their output under $(SolutionDir); set it, since we build the
    # project rather than the solution.
    - name: Build ReBuzz (C# only)
      shell: pwsh
      run: dotnet build ReBuzz/ReBuzz.csproj -c Release "-p:SolutionDir=$($PWD.Path)\" -p:ReBuzzCleanBuild=true -nologo *>&1 | Tee-Object -FilePath build.log

    # The app people launch is NeoBuzzLive.exe: ReBuzz.csproj names its apphost so, beside the assembly it
    # starts, ReBuzz.dll (machines, plugins and tests load it by name), and the file says NeoBuzz Live.
    - name: The app's executable (NeoBuzzLive.exe)
      shell: pwsh
      run: |
        $exe = Get-ChildItem bin -Recurse -Filter NeoBuzzLive.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
        if (-not $exe) { throw 'NeoBuzzLive.exe not built under bin\' }
        if (Test-Path (Join-Path $exe.DirectoryName 'ReBuzz.exe')) { throw "a ReBuzz.exe beside $($exe.FullName)" }
        foreach ($f in 'ReBuzz.dll', 'ReBuzz.runtimeconfig.json') { if (-not (Test-Path (Join-Path $exe.DirectoryName $f))) { throw "$f isn't beside it" } }
        $v = $exe.VersionInfo
        if ($v.FileDescription -ne 'NeoBuzz Live' -or $v.ProductName -ne 'NeoBuzz Live') { throw "its version info says '$($v.FileDescription)', '$($v.ProductName)'" }
        Write-Host "::notice title=The app's executable::$($exe.Name) beside ReBuzz.dll; FileDescription and ProductName '$($v.FileDescription)'"

    # The Modern Pattern Editor (WPF): its machine side is shared with its portable builds
    # (docs/specs/studio-mvp.md S6), so the Windows editor builds here too.
    - name: Build the Modern Pattern Editor (WPF)
      shell: pwsh
      run: dotnet build ModernPatternEditor/ModernPatternEditor.NET/ModernPatternEditor.NET.csproj -c Release "-p:SolutionDir=$($PWD.Path)\" -p:ReBuzzCleanBuild=true -nologo *>&1 | Tee-Object -FilePath mpe-build.log

    # Machine API (docs/specs/engine-split.md §4.3): the portable builds of BuzzGUI.Interfaces and
    # BuzzGUI.Common must stay a subset of the Windows builds that machine DLLs bind to.
    - name: Surface check
      shell: pwsh
      env:
        PYTHONIOENCODING: utf-8
      run: python experiments/engine-census/census.py surface "-p:SolutionDir=$($PWD.Path)\" -p:ReBuzzCleanBuild=true

    - name: Annotate build log
      if: failure()
      shell: pwsh
      run: |
        ./tools/ci-annotate-log.ps1 build.log
        if (Test-Path mpe-build.log) { ./tools/ci-annotate-log.ps1 mpe-build.log }
