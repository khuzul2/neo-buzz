name: ReBuzz Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Fork: the projects put output and restore files under $(SolutionDir), which is only
    # defined when building the .sln; ReBuzzCleanBuild skips a step that breaks clean builds.
    - name: Build ReBuzz (Release)
      run: dotnet build ReBuzz/ReBuzz.csproj -c Release -p:Platform=x64 "-p:SolutionDir=${{ github.workspace }}\" -p:ReBuzzCleanBuild=true

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rebuzz-release-v${{ github.ref_name }}
        path: bin/Release/x64/
