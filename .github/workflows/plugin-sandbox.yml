name: Plugin sandbox (H2)

# TEMPORARY (RB1 probe, branch ci/flakes-rb1 only; restored before the branch is done): the streaming soak, many times, in both prefetch orders.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'unused'
        type: string
        default: '10'
      macos:
        description: 'unused'
        type: boolean
        default: true

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        order: [voice, urgency]
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: NeoStretch (CMake)
      run: |
        cmake -S NeoStretch -B build/NeoStretch
        cmake --build build/NeoStretch -j 3
    - name: The streaming fixture
      env:
        NEOBUZZ_PREFETCH_ORDER: ${{ matrix.order }}
      run: |
        dotnet test ReBuzz.SessionTests --filter "FullyQualifiedName~NeoAudioStreamingTests" --logger "console;verbosity=detailed" > test.log 2>&1 || true
        grep -aE "streamed soak|read\(s\) missed|^ *asset [0-9]|^ *frame [0-9]|  Failed |Total time|Passed:|Failed:" test.log | sort -u | cut -c1-400
        grep -aq "streamed soak: underruns 0, missed samples 0" test.log && echo "SOAK OK (${{ matrix.order }})" || echo "SOAK UNDERRUN (${{ matrix.order }})"
